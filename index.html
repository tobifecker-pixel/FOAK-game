/* Layout: a single deal-room column. Ledger strip on top, narrative + choice cards below, capital stack as a text bar. */
:root{
  --paper:#F3F5F8; --card:#FFFFFF; --ink:#131922; --muted:#5A6472; --line:#D7DCE4;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1217; --card:#161B22; --ink:#E5E9EF; --muted:#94A0AE; --line:#29303A;
  --accent:#829DFF; --accent-soft:#1C2540; --good:#53C68E; --good-soft:#132A20; --warn:#E6A93E; --warn-soft:#2E2412; --bad:#F27B70; --bad-soft:#341815; --violet:#A98BF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1217; --card:#161B22; --ink:#E5E9EF; --muted:#94A0AE; --line:#29303A;
  --accent:#829DFF; --accent-soft:#1C2540; --good:#53C68E; --good-soft:#132A20; --warn:#E6A93E; --warn-soft:#2E2412; --bad:#F27B70; --bad-soft:#341815; --violet:#A98BF0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-story);font-size:18px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.mono,.ledger,.btn,.chip,.card .meta,.eyebrow,.bar-legend,.stat{font-family:var(--f-ui)}
h1,h2{font-family:var(--f-story);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(34px,7vw,52px);letter-spacing:-.01em}
h2{font-size:26px}
p{margin:0;max-width:65ch}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ledger{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.ledger b{font-weight:600}
.ledger .k{color:var(--muted)}
.steps{display:flex;gap:4px;width:100%}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.done{background:var(--accent)}
.steps span.now{background:var(--accent);opacity:.45}
.story{display:flex;flex-direction:column;gap:12px}
.note{border-left:3px solid var(--accent);padding:2px 0 2px 14px;color:var(--muted);font-size:16px}
.real{background:var(--accent-soft);border-radius:6px;padding:12px 14px;font-size:16px}
.real .eyebrow{color:var(--accent);margin-bottom:4px}
.need{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;height:26px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--card)}
.bar div{height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--f-ui);font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.bar-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.bar-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%;transition:border-color .15s, transform .15s}
.card:hover:not([disabled]){border-color:var(--accent)}
.card:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[disabled]{cursor:default}
.card .t{font-weight:600;font-size:18px;line-height:1.3}
.card .meta{font-size:12.5px;color:var(--muted);line-height:1.5}
.card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card.res-good{border-color:var(--good);background:var(--good-soft)}
.card.res-ok{border-color:var(--warn);background:var(--warn-soft)}
.card.res-bad{border-color:var(--bad);background:var(--bad-soft);opacity:.85}
.card.res-neutral{border-color:var(--line);opacity:.9}
.chip{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;font-weight:600;align-self:flex-start}
.chip.good{background:var(--good);color:var(--card)}
.chip.ok{background:var(--warn);color:var(--card)}
.chip.bad{background:var(--bad);color:var(--card)}
.chip.neutral{background:var(--line);color:var(--ink)}
.lesson{font-size:16px}
.src{font-family:var(--f-ui);font-size:11.5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-size:14px;padding:11px 18px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--card);cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.feedback{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--card)}
.feedback.good{border-color:var(--good)} .feedback.ok{border-color:var(--warn)} .feedback.bad{border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.debrief{display:flex;flex-direction:column;gap:10px}
.dline{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.dline .lbl{font-weight:600;font-size:16px;line-height:1.35}
.dline .stage{font-family:var(--f-ui);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dline > div{min-width:0}
.err{color:var(--bad);font-family:var(--f-ui);font-size:13px}
.sources{font-size:14px;color:var(--muted)}
.sources li{margin-bottom:4px}
.hearts{letter-spacing:2px}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
@media (min-width:640px){.cards.two{grid-template-columns:1fr 1fr}}
/* Two-column play layout: main story left, field guide right */
.wrap.play{max-width:1140px}
.cols{display:flex;flex-direction:column;gap:20px}
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.guide{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0}
.guide summary{cursor:pointer;padding:12px 16px;font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);list-style:none;display:flex;justify-content:space-between}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";font-size:16px;line-height:1}
.guide[open] summary::after{content:"–"}
.guide .gbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.gitem h3{font-family:var(--f-ui);font-size:13px;font-weight:600;margin:0 0 3px;letter-spacing:.01em}
.gitem p{font-size:15px;line-height:1.5}
.gitem .src{display:block;margin-top:3px}
@media (min-width:1000px){
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:36px;align-items:start}
  .guide{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
}
/* Conversations */
.convo{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:92%}
.msg.you{align-self:flex-end;flex-direction:row-reverse}
.av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--card)}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:16.5px;line-height:1.45;min-width:0}
.msg.them .bubble{border-top-left-radius:3px}
.msg.you .bubble{background:var(--accent-soft);border-color:transparent;border-top-right-radius:3px}
.bubble .who{display:block;font-family:var(--f-ui);font-size:11px;color:var(--muted);margin-bottom:3px;letter-spacing:.02em}
.why{display:flex;flex-direction:column;gap:5px;border-top:1px dashed var(--line);padding-top:10px}
.card .what{font-size:15px;color:var(--muted);line-height:1.4}
.wire{font-size:15px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.wire .eyebrow{color:var(--accent);margin-right:6px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-family:var(--f-ui);font-size:12px;background:var(--good-soft);border:1px solid var(--good);border-radius:999px;padding:5px 12px;color:var(--ink)}
.badge b{color:var(--good)}
.path{display:flex;flex-direction:column;gap:8px}
.path div{display:grid;grid-template-columns:110px 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:15.5px}
.path div > *{min-width:0}
.path b{font-family:var(--f-ui);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
input.name{font:inherit;font-family:var(--f-ui);font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:100%;max-width:360px}
input.name:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
/* ================= 8-bit skin (Sweetie-16 palette, pixel borders, pixel type) ================= */
:root{
  --paper:#e9edf3; --card:#ffffff; --ink:#1a1c2c; --muted:#566c86; --line:#94b0c2;
  --accent:#3b5dc9; --accent-soft:#dce5ff; --good:#24855b; --good-soft:#dff3e6; --warn:#b8541f; --warn-soft:#fdecdf; --bad:#b13e53; --bad-soft:#f9e1e5; --violet:#5d275d;
  --edge:#1a1c2c; --drop:#1a1c2c; --grid:#dfe4ec;
  --f-pixel:"Press Start 2P", ui-monospace, monospace;
  --f-story:"VT323", ui-monospace, "SF Mono", Menlo, monospace;
  --f-ui:"VT323", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a1c2c; --card:#262b44; --ink:#f4f4f4; --muted:#94b0c2; --line:#333c57;
  --accent:#41a6f6; --accent-soft:#29366f; --good:#38b764; --good-soft:#1d3a33; --warn:#ef7d57; --warn-soft:#3d2a2c; --bad:#e2607a; --bad-soft:#3a1f2c; --violet:#b48cf2;
  --edge:#566c86; --drop:#0b0c16; --grid:#1f2236; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a1c2c; --card:#262b44; --ink:#f4f4f4; --muted:#94b0c2; --line:#333c57;
  --accent:#41a6f6; --accent-soft:#29366f; --good:#38b764; --good-soft:#1d3a33; --warn:#ef7d57; --warn-soft:#3d2a2c; --bad:#e2607a; --bad-soft:#3a1f2c; --violet:#b48cf2;
  --edge:#566c86; --drop:#0b0c16; --grid:#1f2236; color-scheme:dark}
*{border-radius:0!important}
body{font-family:var(--f-story);font-size:21px;line-height:1.3;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:32px 32px}
h1,h2,.eyebrow,.btn,.chip,.stat .v,.stat .k,.gitem h3,.path b,.guide summary,.snd{font-family:var(--f-pixel);font-weight:400}
h1{font-size:clamp(22px,5.4vw,36px);line-height:1.3;letter-spacing:0;text-shadow:4px 4px 0 var(--accent-soft)}
h2{font-size:clamp(15px,3.4vw,19px);line-height:1.45}
.eyebrow{font-size:9.5px;letter-spacing:.06em;line-height:1.6}
p{max-width:62ch}
.note{font-size:20px}
.ledger{font-size:19px;background:var(--paper);border-bottom:3px solid var(--edge);gap:4px 16px}
.hearts{color:var(--bad);letter-spacing:3px}
.steps span{height:10px;background:var(--card);border:2px solid var(--edge)}
.steps span.done{background:var(--accent)}
.steps span.now{background:var(--accent);opacity:1;background-image:repeating-linear-gradient(90deg,var(--card) 0 4px,transparent 4px 8px);animation:march 1s steps(4) infinite}
@keyframes march{to{background-position:8px 0}}
.card{position:relative;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--drop);transition:transform .1s steps(2),box-shadow .1s steps(2)}
.card:hover:not([disabled]){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--drop);border-color:var(--edge)}
.card:active:not([disabled]){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--drop)}
.card.sel{border-color:var(--accent);box-shadow:4px 4px 0 var(--accent)}
.card .t{font-size:22px;font-weight:400;line-height:1.15}
.card .what{font-size:18.5px;line-height:1.2}
.card .meta{font-size:17px;line-height:1.25}
.card.res-good{border-color:var(--good)} .card.res-ok{border-color:var(--warn)} .card.res-bad{border-color:var(--bad)}
.card.rejected::after{content:"REJECTED";position:absolute;top:10px;right:10px;font-family:var(--f-pixel);font-size:9px;color:var(--bad);border:3px solid var(--bad);padding:5px 6px;background:var(--card);transform:rotate(-7deg)}
.card.just.rejected{animation:shake .4s steps(6)}
.card.just.res-good,.card.just.res-ok,.card.just.res-neutral{animation:pop .35s steps(4)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:none}}
.chip{font-size:8.5px;padding:5px 7px;letter-spacing:.02em;line-height:1.3}
.btn{font-size:11px;padding:14px 16px;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--drop);text-transform:uppercase;letter-spacing:.02em;transition:transform .1s steps(2),box-shadow .1s steps(2)}
.btn:hover:not([disabled]){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--drop)}
.btn:active:not([disabled]){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--drop)}
.btn.ghost{background:var(--card);color:var(--ink)}
.snd{font-size:8.5px;padding:6px 8px;border:2px solid var(--edge);background:var(--card);color:var(--ink);cursor:pointer;margin-left:auto}
.snd[aria-pressed="true"]{background:var(--accent);color:var(--card)}
.feedback{border:3px solid var(--edge);box-shadow:4px 4px 0 var(--drop)}
.feedback.good{border-color:var(--good)} .feedback.ok{border-color:var(--warn)} .feedback.bad{border-color:var(--bad)}
.feedback.bad.alarm{animation:alarm .5s steps(2) 3}
@keyframes alarm{50%{box-shadow:4px 4px 0 var(--bad),0 0 0 4px var(--bad-soft)}}
.lesson{font-size:20px}
.src{font-size:15.5px}
.bubble{border:3px solid var(--edge);box-shadow:3px 3px 0 var(--drop);font-size:20px;line-height:1.25}
.bubble .who{font-size:15.5px}
.msg.you .bubble{border-color:var(--edge)}
.av{width:36px;height:36px;font-family:var(--f-pixel);font-size:9px;border:2px solid var(--edge)}
.bar{height:32px;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--drop)}
.bar div{font-family:var(--f-pixel);font-size:8px;background-image:repeating-linear-gradient(90deg,transparent 0 12px,rgba(0,0,0,.2) 12px 14px)}
.bar div.grow{transform-origin:left;animation:growX .6s steps(6)}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar-legend{font-size:16px}
.real,.wire,.stat,.guide,.path div,.dline{border:3px solid var(--edge);box-shadow:4px 4px 0 var(--drop)}
.real{background:var(--accent-soft);font-size:19px}
.wire{font-size:18.5px}
.stat .v{font-size:clamp(14px,3vw,18px);line-height:1.5}
.stat .k{font-size:8px;line-height:1.6}
.gitem h3{font-size:9px;line-height:1.6}
.gitem p{font-size:18.5px;line-height:1.25}
.guide summary{font-size:9px}
.path b{font-size:8.5px;line-height:1.6}
.path div{font-size:18.5px}
.badge{font-size:17px;border:3px solid var(--good);box-shadow:3px 3px 0 var(--drop)}
.dline .lbl{font-size:20px}
.dline .stage{font-size:15px}
input.name{font-family:var(--f-story);font-size:21px;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--drop)}
.lvl{display:flex;align-items:center;gap:14px}
.lvl canvas{image-rendering:pixelated;flex:0 0 auto}
.hero{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.hero canvas{image-rendering:pixelated}
.press{font-family:var(--f-pixel);font-size:10px;color:var(--accent);animation:blinkT 1.2s steps(2) infinite}
@keyframes blinkT{50%{opacity:0}}

/* celebration overlay: one deliberate dark 'game screen' look in both themes */
#fx{position:fixed;inset:0;z-index:50;background:rgba(26,28,44,.94);display:flex;align-items:center;justify-content:center;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#fx[hidden]{display:none!important}
#fxP{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.fx-panel{position:relative;background:#1a1c2c;color:#f4f4f4;border:4px solid #f4f4f4;box-shadow:0 0 0 4px #1a1c2c,10px 10px 0 4px #000;padding:26px 22px 22px;width:min(460px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.fx-panel h2{font-family:var(--f-pixel);font-size:clamp(15px,4.4vw,21px);line-height:1.45;color:#ffcd75;text-shadow:3px 3px 0 #b13e53;margin:0}
#fx.sad .fx-panel h2{color:#94b0c2;text-shadow:3px 3px 0 #333c57}
.fx-panel p{font-family:var(--f-story);font-size:21px;line-height:1.25;color:#f4f4f4;margin:0}
.fx-level{font-family:var(--f-pixel);font-size:9px;line-height:1.6;color:#73eff7;letter-spacing:.04em}
.fx-sprite{image-rendering:pixelated;max-width:100%}
.fx-sprite.pop{animation:spritePop .5s steps(5) both,bob 1.2s steps(2) .5s infinite}
.fx-sprite.dig{animation:spritePop .4s steps(4) both,dig .7s steps(3) .4s infinite;transform-origin:50% 80%}
@keyframes spritePop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes dig{0%{transform:rotate(-14deg)}50%{transform:rotate(16deg) translateY(6px)}100%{transform:rotate(-14deg)}}
.fx-btn{font-family:var(--f-pixel);font-size:11px;background:#ffcd75;color:#1a1c2c;border:3px solid #f4f4f4;padding:13px 18px;cursor:pointer;box-shadow:4px 4px 0 #b13e53}
.fx-btn:focus-visible{outline:3px solid #73eff7;outline-offset:3px}
.fx-btn:hover{background:#a7f070}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,60px);opacity:0;z-index:60;font-family:var(--f-pixel);font-size:10px;line-height:1.6;padding:12px 16px;background:#1a1c2c;color:#ffcd75;border:3px solid #f4f4f4;box-shadow:4px 4px 0 #000;transition:transform .25s steps(3),opacity .25s steps(3);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast.good{color:#a7f070} #toast.bad{color:#ef7d57}

/* card binder */
body.noscroll{overflow:hidden}
#binder{position:fixed;inset:0;z-index:45;background:var(--paper);overflow-y:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:32px 32px}

.cardsbtn{margin-left:auto}

.ccard:hover{transform:translate(-2px,-3px)}
.ccard:focus-visible,.cardsbtn:focus-visible,.snd:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.ccard .cname{font-size:19px;line-height:1.05}

.r-epic{background-image:linear-gradient(135deg,transparent 0 70%,var(--accent-soft) 70% 100%)}
.r-trap{background-image:repeating-linear-gradient(45deg,transparent 0 10px,var(--bad-soft) 10px 14px)}
.mastered{border-color:#ffcd75!important;box-shadow:4px 4px 0 var(--drop),0 0 0 3px #b8860b inset}
.mastered::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,205,117,.35) 45%,transparent 60%);background-size:300% 100%;animation:foil 2.4s steps(12) infinite}
@keyframes foil{from{background-position:100% 0}to{background-position:-100% 0}}
.cbig{position:relative;background:var(--card);border:4px solid var(--tc,var(--edge));box-shadow:6px 6px 0 var(--drop);padding:18px;display:flex;flex-direction:column;gap:14px;max-width:620px}
.chead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-pixel);font-size:8.5px;color:var(--tc)}
.chead .cm{color:#b8860b}
.ctop{display:flex;align-items:center;gap:16px}
.ctop canvas{image-rendering:pixelated;flex:0 0 auto}
.ctop h3{font-family:var(--f-pixel);font-weight:400;font-size:clamp(14px,3.6vw,18px);line-height:1.45;margin:0}
.cstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;font-size:17px}
.cstats div{display:flex;flex-direction:column;gap:3px}
.cbars{display:flex;gap:3px}
.cbars i{width:18px;height:12px;border:2px solid var(--edge);background:var(--paper)}
.cbars i.on{background:var(--tc)}
.cbig dl{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;margin:0;font-size:19px;line-height:1.25}
.cbig dt{font-family:var(--f-pixel);font-size:8.5px;line-height:1.9;color:var(--muted)}
.cbig dd{margin:0;min-width:0}
.chint{font-size:18px;color:var(--accent)}
@media (max-width:520px){.cbig dl{grid-template-columns:1fr}.cbig dt{margin-top:4px}}
@media (prefers-reduced-motion:reduce){.mastered::after{animation:none}}


/* about / disclaimer */

.bhead h2{overflow-wrap:anywhere}

<body>
<div class="wrap" id="app"></div>

<script>
/* ---------------- Counterparties (fictional people) ---------------- */
const P={
  you:{n:"You",r:"Founder & CEO",t:"you"},
  vc:{n:"Lena Brandt",r:"Partner, 8-Bit Climate Ventures",t:"investor"},
  agency:{n:"Dr. Tomasz Wójcik",r:"Programme officer, public funding agency",t:"public"},
  host:{n:"Ines Okafor",r:"Operations lead at the host facility",t:"partner"},
  vlender:{n:"Raj Mehta",r:"Director, Cartridge Credit Partners",t:"bank"},
  housebank:{n:"Henrik Saar",r:"Relationship manager, your house bank",t:"bank"},
  cvc:{n:"Charlotte Duval",r:"Head of Ventures at an industry incumbent",t:"customer"},
  strat:{n:"Marco Bellini",r:"Head of Strategy at a target customer",t:"customer"},
  lessor:{n:"Sofia Lind",r:"Equipment finance, Sprite Leasing Co.",t:"bank"},
  regbank:{n:"Peter Holm",r:"Business banking, Pixeltown Savings Bank",t:"bank"},
  infra:{n:"James Whitford",r:"Partner, core infrastructure fund",t:"investor"},
  board:{n:"Anders Kvist",r:"Your board chair",t:"internal"},
  buyer:{n:"Yuki Tanaka",r:"Head of procurement at your anchor customer",t:"customer"},
  director:{n:"Maria Santos",r:"Your new project director",t:"internal"},
  cfo:{n:"Jonas Weber",r:"Your CFO",t:"internal"},
  epc:{n:"Graham Pike",r:"Bid manager, top-tier EPC contractor",t:"partner"},
  supplier:{n:"Elif Demir",r:"Key-account lead, core equipment supplier",t:"partner"},
  permit:{n:"Sanne de Vries",r:"Head of permitting, regional authority",t:"public"},
  reg:{n:"Dr. Léa Fontaine",r:"Regulatory adviser, food safety",t:"partner"},
  ie:{n:"Dr. Kwame Asante",r:"Independent engineer",t:"partner"},
  insurer:{n:"Hannah Ross",r:"Underwriter, specialty insurer",t:"partner"},
  pfbank:{n:"Marta Lindqvist",r:"Director, Project Finance, mandated lead arranger",t:"bank"},
  publender:{n:"Jean-Luc Moreau",r:"Senior investment officer, European public lender",t:"public"},
  infragrowth:{n:"Priya Natarajan",r:"Partner, climate infrastructure fund",t:"investor"},
  catalytic:{n:"Amara Osei",r:"Programme lead, catalytic capital fund",t:"public"},
  crossover:{n:"Ben Carter",r:"Partner, crossover growth fund",t:"investor"},
  incumbent:{n:"Dieter Krause",r:"CEO of an industry incumbent",t:"customer"}
};
const P_COLOR={you:"var(--accent)",investor:"var(--accent)",bank:"var(--warn)",public:"var(--good)",customer:"var(--violet)",partner:"var(--muted)",internal:"var(--ink)"};
const PROD={steel:"green steel",saf:"e-SAF",pf:"animal-free whey protein",biochem:"bio-based chemicals",ldes:"firm storage capacity"};
const missText=m=>m.length>1?m.slice(0,-1).join(", ")+" and "+m[m.length-1]:m[0];

/* TALK: what you say, and what they say back. yes/no can read flags (f) and the result (r). */
const TALK={
  "pilot.vcA":{p:"vc",pitch:"Our lab results are solid at TRL 4. We want to prove the process at pilot scale.",
    yes:()=>"This is exactly our stage. Taking technology risk is our job. We'll lead the round and keep a reserve for your next one. Just don't expect us to fund the commercial plant on our own later; our fund isn't built for that."},
  "pilot.grantRD":{p:"agency",pitch:"Our pilot programme fits your call: pre-competitive work with clear milestones.",
    yes:()=>"Your proposal scored well. The grant agreement takes about four months, and we pay against milestones. Feel free to share our evaluation with your investors; it tends to help."},
  "pilot.shared":{p:"host",pitch:"Could we run our pilot campaigns on your equipment instead of building our own?",
    yes:()=>"We have capacity from Q3. You pay per campaign, you keep your data, and you can test a wider range of conditions than you could afford on your own kit."},
  "pilot.vdebt":{p:"vlender",pitch:"We'd like a venture debt facility to extend our runway through the pilot.",
    no:()=>"What would I lend against? You have no revenue and no big equity round behind you yet. Come back once customers are paying, or right after a large round closes."},
  "pilot.bank":{p:"housebank",pitch:"We need a term loan to build our pilot.",
    no:()=>"I like the story, but my credit committee will ask for cash flow and collateral, and you have neither. This is equity risk. I can't price it as a loan."},
  "pilot.cvcX":{p:"cvc",pitch:"Would your venture arm invest in our pilot?",
    yes:()=>"Happily. One condition: five years of exclusivity on your product in our markets. It's standard for us."},
  "demo.seriesB":{p:"vc",pitch:"The pilot data are in: thousands of hours, targets met. We're raising for the demo.",
    yes:()=>"We've brought in two co-investors who know industrial scale-up. No single fund wants this much concentration, and three strong names on the cap table will matter to whoever funds your plant."},
  "demo.strategic":{p:"strat",pitch:()=>`Would you invest alongside a joint development agreement? You'd help shape the ${PROD[S.sector]} you'll eventually buy.`,
    yes:f=>f.exclusivity?"We'd like to, but your exclusivity with our competitor's venture arm limits what we can do together. A small ticket is all I can get approved.":"Our board approved a minority stake. We get early access and a say in the spec; you get a reference customer. When you're ready to build the plant, we'll talk offtake."},
  "demo.grantDemo":{p:"agency",pitch:"Our demo is ready to build and already co-funded.",
    yes:()=>"Approved. The deadlines are strict and the reporting is heavy, but our due diligence tends to open other doors for you."},
  "demo.lease":{p:"lessor",pitch:"Could you lease us the standard equipment in our demo plant?",
    yes:()=>"Pumps, compressors, tanks, the electrical skid: yes. We keep title to the equipment, so whether your process works isn't our risk. The custom reactor stays on your balance sheet."},
  "demo.regBank":{p:"regbank",pitch:"We need a construction loan for the demo.",
    yes:()=>"We can do that. The equipment is our collateral and your investors look strong. Standard covenants on budget and schedule. Just stay on plan."},
  "demo.infra":{p:"infra",pitch:"Would you invest equity in our demo plant?",
    no:()=>"We buy 20 years of contracted cash flows at low risk. Your demo has no contracts and no track record. Call us when plant number two or three is being built."},
  "demo.skip":{p:"board",pitch:"What if we skip the demo and go straight to commercial scale?",
    yes:()=>"Speed wins markets. The pilot worked, so let's go big. I'll tell the investors we're two and a half years ahead of plan."},
  "dev.offtake":{p:"buyer",pitch:()=>`We're asking for a 10-year take-or-pay contract for over half the plant's ${PROD[S.sector]}, at a fixed green premium.`,
    yes:f=>f.skippedDemo?"Without demo data I can't get volume commitments past my board. I'll sign a letter of intent, nothing binding.":f.singleOfftaker?"Given your exclusivity, we'll take the full output. Just be aware you'll depend on us alone.":"Our board signed off: ten years, take-or-pay, tied to this plant, with a commissioning window and a price floor and ceiling. Our credit rating should help with your lenders."},
  "dev.loi":{p:"buyer",pitch:"Would you sign a letter of intent to buy from our first plant?",
    yes:()=>"Sure. An LOI costs us nothing. Send the template over."},
  "dev.team":{p:"director",pitch:"Welcome aboard. Where do you start?",
    yes:()=>"I've built two chemical plants and closed a €400M project financing. First, I'll challenge every number in the EPC estimates. Second, I'll make sure someone owns every interface on this site."},
  "dev.epcWrap":{p:"epc",pitch:"Can you give us a fixed-price, date-certain turnkey contract?",
    yes:()=>"We can, but we've never built your process, so we'll price that risk. Expect a premium of about 20%, our schedule, and little room for your engineers to iterate."},
  "dev.multiEpc":{p:"supplier",pitch:"We'll integrate the packages ourselves. Will you guarantee the performance of your units?",
    yes:f=>f.interfaceRisk?"For our unit, yes, with liquidated damages if it underperforms. But who on your side manages the interfaces between the packages? Nobody has asked us that yet.":"Yes. We guarantee output and availability for our units, with liquidated damages if we miss. Your project director already has our interface schedule."},
  "dev.site":{p:()=>S.sector==="pf"?"reg":"permit",pitch:()=>S.sector==="pf"?"How do we avoid waiting years for EU approval?":"We want to start permits now, on a brownfield site.",
    yes:()=>S.sector==="pf"?"File the Novel Food dossier now, and make it complete the first time; incomplete dossiers stall. Meanwhile a US self-affirmed GRAS route can get you to customers within a year.":"Brownfield helps: the land is already zoned for industry and the utilities are there. File now and we can run the environmental review in parallel with your design."},
  "dev.ie":{p:"ie",pitch:"Please review our design, capex and model before we go to lenders.",
    yes:()=>"Your 92% first-year uptime is optimistic. I've added a downside case at 60%, and I've flagged two single points of failure. Lenders will read my report before yours."},
  "dev.contingency":{p:"cfo",pitch:"Should we really budget 25-30% contingency?",
    yes:()=>"It makes the budget look 15% bigger, but lenders expect it at FOAK and most FOAKs overrun. Raising it now is far cheaper than going back to investors halfway through construction."},
  "dev.bigGrant":{p:"agency",pitch:"We'd like to apply to the large-scale call for our FOAK.",
    yes:()=>"Application received. Evaluation takes about nine months. If you're selected, the grant agreement can be signed before your final investment decision."},
  "dev.tpi":{p:"insurer",pitch:"Would you insure the plant's output against underperformance?",
    yes:()=>"Your demo logged thousands of continuous runtime hours, with a root-cause analysis for every stoppage. That's data I can price. We'll insure output against the guaranteed performance curve.",
    no:()=>"Without runtime data I have nothing to price. Come back with a few thousand hours of operation."},
  "close.senior":{p:"pfbank",pitch:"We're seeking senior non-recourse debt for 40% of the project.",
    yes:()=>"Credit committee approved it. 40% loan-to-value, a 1.8x minimum debt-service cover ratio, a cash sweep, and drawdowns tied to construction milestones. Your offtake contracts and guarantees did the heavy lifting.",
    no:(f,r)=>`Not yet. Before we can lend I need ${missText(r.miss)}. Banks can't take equity risk for a debt return. Come back when those are in place.`},
  "close.gov":{p:"publender",pitch:"Would you take a senior tranche in our first-of-a-kind plant?",
    yes:()=>"Yes, 25%. Our mandate lets us carry first-of-a-kind risk once the engineering is independently validated. Our diligence took a while, but our repayment profile can flex if ramp-up runs long.",
    no:(f,r)=>`Our mandate allows first-of-a-kind risk, not unvalidated risk. We would need ${missText(r.miss)}.`},
  "close.grant":{p:"agency",pitch:"Can our grant support the FOAK budget?",
    yes:()=>"Your grant agreement is signed. Disbursement follows your milestones.",
    no:()=>"The call closed months ago. You needed to apply during development. The next call opens next year."},
  "close.projEq":{p:"infragrowth",pitch:"Would you invest equity in the project company?",
    yes:()=>"Yes, into the project company, not your TopCo, released in tranches at financial close, mechanical completion and the performance test. Your offtake and your delivery team are why we're here.",
    no:(f,r)=>`We like the technology, but we invest in projects, not science. We'd need ${missText(r.miss)}.`},
  "close.stratEq":{p:"strat",pitch:"Would you put equity into the project company next to your offtake?",
    yes:()=>"Yes. It secures our supply, and lenders like seeing the customer with skin in the game.",
    no:()=>"We don't know you well enough to invest. That relationship should have started at the demo."},
  "close.catalytic":{p:"catalytic",pitch:"Could you take a first-loss slice of the stack?",
    yes:()=>"We'll take the first-loss position: if things go wrong, we lose money first. That's what lets the commercial money in. Our capital is limited, though, so it's only a thin slice."},
  "close.super":{p:"crossover",pitch:"We want to fund the plant with a large equity round at the company level.",
    yes:()=>"We'll lead it. Understand what you're buying: expensive money, heavy dilution, and the whole company riding on one plant."},
  "close.vdebt":{p:"vlender",pitch:"Can we add some venture debt to close the gap?",
    yes:()=>"Now that there's equity behind you, yes. Three years, interest-only for 18 months, then it amortises. Make sure the plant is producing by then."},
  "close.sellout":{p:"incumbent",pitch:"Would you take over the project and build it on your balance sheet?",
    yes:()=>"We'll take a majority of the project company and fund the build. You keep a minority and a licence fee. Our engineers will run it our way."}
};

/* One-line plain-language explainers on each card */
const WHAT={
  "pilot.vcA":"Equity from funds that back early technology in exchange for a share of the company.",
  "pilot.grantRD":"Public money for research milestones. Non-dilutive: you give up no shares.",
  "pilot.shared":"Rent time on existing equipment instead of buying your own.",
  "pilot.vdebt":"A loan to venture-backed companies, usually lent against revenue or a recent equity round.",
  "pilot.bank":"A plain bank loan, repaid from cash flow and secured on assets.",
  "pilot.cvcX":"Equity from a corporation's venture arm, with strings attached.",
  "demo.seriesB":"A larger equity round shared between several investors.",
  "demo.strategic":"A future customer buys shares and co-develops the product with you.",
  "demo.grantDemo":"Public money for building and running a demonstration plant.",
  "demo.lease":"A lessor buys standard equipment and rents it to you.",
  "demo.regBank":"A bank loan to build the demo, with budget and schedule covenants.",
  "demo.infra":"Long-term equity from funds that own toll roads, grids and power plants.",
  "demo.skip":"Go from pilot straight to the commercial plant, roughly a 100× jump.",
  "close.senior":"Debt repaid first, from the project's cash flow only (non-recourse), with no claim on your company.",
  "close.gov":"Senior debt from a public lender with a mandate to carry more risk than banks.",
  "close.grant":"Non-dilutive public money paid against milestones.",
  "close.projEq":"Equity in the plant's own company (SPV) rather than in your company.",
  "close.stratEq":"Customers and suppliers buy shares in the plant's company.",
  "close.catalytic":"Philanthropic or impact money that takes losses first to protect other investors.",
  "close.super":"A very large equity round in your company (the TopCo), with the plant on its balance sheet.",
  "close.vdebt":"A short-term loan to your company, repaid within three years.",
  "close.sellout":"An incumbent takes control of the plant and funds it from its own balance sheet."
};

/* Field guide per stage */
const GUIDE={
  pilot:[
    {t:"What this stage proves",d:"The process works under operating conditions (TRL 4-6). Pilots typically cost €1-10M and run 1-2 years of process validation.",src:"BCG p4; AFRY p6"},
    {t:"Who funds it",d:"Grants and venture capital. Corporates may join. Debt is not available yet, because there is no cash flow and no collateral.",src:"BCG p12; TUM p21"},
    {t:"Dilution",d:"Each equity round gives away part of your company. Non-dilutive money (grants, shared facilities) protects your stake for the expensive stages later.",src:"OCED p16"},
    {t:"The valley of death",d:"Venture funding peaks around TRL 4 and falls off; infrastructure money only arrives at TRL 9. The gap sits at TRL 7-8, exactly where your FOAK will be.",src:"TNI p4-5"},
    {t:"Capital-efficient scale-up",d:"Since 2021 investors have preferred shared pilot plants, contract manufacturers and brownfield sites over building your own assets early.",src:"Invest-NL Agrifood p39"}
  ],
  demo:[
    {t:"What this stage proves",d:"The integrated system works (TRL 6-7). Demos typically cost €20-100M and need 1-2 years to build plus 2-3 years of validation.",src:"BCG p4; OCED p10"},
    {t:"The 10× rule",d:"Engineers scale up about one order of magnitude per step. Bigger jumps lock in flaws you only discover at scale.",src:"BCG p7, p9"},
    {t:"The three-legged stool",d:"Almost every successful FOAK rested on three legs: a syndicate of specialist VCs, corporate partners who invest and buy, and government grants or loans.",src:"TNI p7-9"},
    {t:"Why banks stay out",d:"Only 1 of 9 early demo projects in the DOE study had project-level debt. Equipment leases are the exception: the lender holds the equipment, not the technology risk.",src:"OCED p16-17"},
    {t:"Exclusivity",d:"Corporate investors often ask for exclusivity. Most FOAK developers refused it to keep buyers and investors open.",src:"OCED p16"}
  ],
  dev:[
    {t:"Financeable vs bankable",d:"Financeable means you can raise high-risk capital (grants, equity). Bankable means you can raise cheap debt, which needs offtake, an EPC contract, collateral and credit enhancement.",src:"TUM p21"},
    {t:"Take-or-pay offtake",d:"A buyer commits to pay for contracted volume whether or not it takes delivery. Lenders count binding, asset-specific contracts. LOIs don't count.",src:"OCED p17; AFRY p20-21"},
    {t:"EPC wrap vs owner-integrator",d:"An EPC (engineering, procurement, construction) wrap gives one fixed price and date. Most FOAKs instead split the work into packages and integrate it themselves, with performance guarantees from suppliers.",src:"OCED p20"},
    {t:"Independent engineer",d:"A third-party expert lenders rely on to validate your design, capex, uptime and downside cases.",src:"BCG p9"},
    {t:"Contingency",d:"FOAKs need 25-30% contingency. 10 of 16 European FOAKs overran their budget, two by more than 80%.",src:"OCED p19; AFRY p15"},
    {t:"Lenders' six bricks",d:"Superior tech, market acceptance, project-management capability, robust EPC contracts, supply chain, and a line of sight to future funding.",src:"TNI p9"}
  ],
  close:[
    {t:"TopCo vs ProjectCo",d:"Your startup (the TopCo) owns the IP. The plant sits in a separate project company (an SPV), so project investors don't dilute your TopCo and a failure is ring-fenced.",src:"BCG p4, p9"},
    {t:"Stack by risk layer",d:"Grants and first-loss capital at the bottom, then equity, then public and commercial debt. Each layer is paid back in reverse order if things go wrong.",src:"Road p48-49; BCG p9"},
    {t:"Loan-to-value (LTV)",d:"Debt as a share of project cost. FOAK lenders go to 20-60%, compared with about 80% for solar.",src:"OCED p19"},
    {t:"Debt-service cover ratio (DSCR)",d:"Cash flow divided by debt payments. FOAK lenders want 1.5-2x or more; mature projects need 1.2-1.5x.",src:"OCED p19"},
    {t:"Government lenders lead",d:"So far, FOAK project lending has been dominated by public lenders (DOE LPO, EIB, export credit agencies), with 2+ years of diligence.",src:"OCED p19"},
    {t:"Allocation errors",d:"BCG names three: venture equity taking execution risk, senior debt arriving before downside is bounded, and infrastructure capital arriving before operating proof.",src:"BCG p10"}
  ],
  build:[
    {t:"Ramp-up",d:"Business cases assume 6-12 months to reach nameplate capacity. About three years is common, and 61% of FOAKs ran 12+ months late.",src:"AFRY p12"},
    {t:"Liquidated damages",d:"Pre-agreed compensation a supplier pays if equipment underperforms or arrives late. It turns technical risk into money.",src:"OCED p17"},
    {t:"Down round",d:"Raising equity at a lower valuation than the last round, so existing holders are diluted more heavily.",src:"AFRY p15"},
    {t:"After COD",d:"Once the plant runs, operating data make the next plant bankable, and the FOAK itself can be refinanced with cheaper debt.",src:"OCED p18; BCG p9"}
  ]
};

function persona(key){const k=typeof key==="function"?key():key;return P[k]||P.you;}

    setup:[["gridop","We can't offer new connection capacity at your greenfield site before 2031."],["cfo","And energy here costs much more than in the Nordics or the US."]],
    choices:[
      {label:"Co-locate at an industrial cluster with an existing connection and shared utilities",v:"good",fx:S=>{S.flags.colocate=true;S.month+=2;},reply:["gridop","There's spare capacity at the cluster site. You can connect next year."],lesson:"Clustering demo and commercial plants lets them share utilities and permits, and brownfield sites move faster through permitting.",src:"Invest-NL Agrifood p40-41; AFRY p27"},
      {label:"Build the plant elsewhere in Europe; keep R&D and control in the Netherlands",v:"ok",fx:S=>{S.flags.colocate=true;S.flags.abroad=true;},reply:["cfo","Cheaper power abroad. But Dutch public co-investment won't follow us there."],lesson:"Invest-NL suggests producing where the economics are best within European value chains while keeping control points in the Netherlands. The trade-off: national instruments stay home.",src:"Invest-NL Agrifood p7, p12, p42"},
      {label:"Wait in the queue at the greenfield site",v:"bad",fx:S=>{S.month+=12;S.flags.colocate=true;},reply:["gridop","You're on the list."],lesson:"A year of burn for a grid connection. External interfaces such as local infrastructure are among the most-cited FOAK integration problems.",src:"AFRY p14; Invest-NL Agrifood p41"}]},
  {id:"frRegion",at:"demo",region:"france",title:"Move to where the ecosystem is?",
    setup:[["bpi","Première Usine can fund a real share of your first plant, if it's built in France."],["partnerFR","Grand Est has the feedstock, a demo facility and us as a partner. But you'd have to move your site plan."],["cfo","Our pilot was elsewhere. Moving costs months."]],
    choices:[
      {label:"Build where the partner, feedstock and demo facilities are",v:"good",fx:S=>{S.flags.strategicPartner=true;S.month+=4;},reply:["partnerFR","Welcome. We'll take a stake and supply the feedstock."],lesson:"Biofibre built pilots in Bavaria, found no local industrial partner, and formed a JV with a French company to build its first plant in Grand Est. Regions with feedstock, industrial partners and corporate investors win FOAKs; funding alone isn't enough.",src:"EIB p31, p36-39"},
      {label:"Stay where you are, without a partner",v:"ok",reply:["cfo","We keep our schedule, and we keep all the risk."],lesson:"Generous funding without the ecosystem fails, as Bavaria's scale-up programme showed when too few companies applied.",src:"EIB p36-39"}]},
  {id:"deBanks",at:"dev",region:"germany",prio:5,title:"The banks don't know your contracts",
    setup:[["gerbank","Our credit committee doesn't know these contract structures, and capital rules make unproven assets expensive for us. We'd do 30% of the project, at most."],["publender","We could anchor the senior debt and standardise the documentation for the other banks."]],
    choices:[
      {label:"Let the public lender anchor the debt and standardise the documentation",v:"good",fx:S=>{S.flags.govAnchor=true;S.month+=3;},reply:["gerbank","With a public anchor lender and standard documents, we can go to 40%."],lesson:"German interviewees describe risk-averse banks unfamiliar with non-standard contracts, and Basel risk weights make holding unproven assets punitive. Public anchors, shared due diligence and standardised contracts help.",src:"TUM p17-19, p24-25"},
      {label:"Shop the deal to more commercial banks",v:"ok",fx:S=>{S.month+=6;},reply:["gerbank","Six months later: same answer from four more banks."],lesson:"The constraint is structural (risk weights, unfamiliar contracts), not one bank's appetite.",src:"TUM p17-19"},
      {label:"Accept tougher terms: a 3× DSCR and tight covenants",v:"ok",fx:S=>{S.flags.strictCovenants=true;},reply:["gerbank","Agreed. Any shortfall in year one trips a covenant."],lesson:"FOAK lenders ask for DSCR of 1.5-2×; one commodity-exposed company faced 3×. Tight covenants turn a slow ramp-up into a default.",src:"OCED p19"}]},
  {id:"nordicsNtp",at:"close",region:"nordics",title:"Reserve the long-lead slots?",
    setup:[["supplier","Our production slots for 2028 are going fast. Commit now, or wait 18 months."],["board","Financial close slipped again. Do we really commit money before every lender has signed?"]],
    choices:[
      {label:"Issue limited notices to proceed on long-lead items only",v:"good",fx:S=>{S.month-=2;},reply:["supplier","Slots reserved, with an exit fee if you cancel before close."],lesson:"Stegra kept contractors and suppliers engaged through a slipping financial close with transparent communication and limited notices to proceed. Long-lead procurement can take up to 12 months.",src:"OCED p22-23, p32"},
      {label:"Commit full orders now",v:"bad",fx:S=>{S.stake*=.95;S.mods.capex+=.1;},reply:["board","Now we're exposed if anything slips."],lesson:"Full commitments before close put equity at risk on a schedule you don't control.",src:"OCED p22-23"},
      {label:"Wait for every signature",v:"ok",fx:S=>{S.month+=8;},reply:["supplier","Next available slot: late 2029."],lesson:"Safe but slow: long-lead items set the critical path.",src:"OCED p22"}]}
];
function pickDilemma(k){
  const pool=DILEMMAS.filter(d=>d.at===k&&(!d.region||d.region===S.region)&&(!d.cond||d.cond(S))&&!S.usedD.includes(d.id));
  if(!pool.length)return null;
  const reg=pool.filter(d=>d.region);if(reg.length)return reg[0];
  const top=Math.max(...pool.map(d=>d.prio||0));const best=pool.filter(d=>(d.prio||0)===top);
  return best[Math.floor(Math.random()*best.length)];
}

/* ---------------- Committee questions ---------------- */
const QUIZ=[
  {at:"pilot",p:"vc",q:"Best-practice scale-up per step is roughly:",o:["~10×","~100×","~2×"],why:"Engineers scale about one order of magnitude per step (5-20×) unless evidence supports more.",src:"BCG p4, p7"},
  {at:"pilot",p:"vc",q:"The 'three-legged stool' behind most successful FOAKs is:",o:["VC syndicate, corporate offtake/equity, government grants or loans","Bank debt, bonds, IPO","Angels, crowdfunding, venture debt"],why:"Almost all successful FOAKs in the 18 case studies combined those three sources.",src:"TNI p1, p7-9"},
  {at:"pilot",p:"agency",q:"Where on the readiness ladder is the 'valley of death'?",o:["TRL 7-8: demo and FOAK","TRL 1-3: concept","TRL 9+: mature"],why:"VC peaks around TRL 4; private equity and infrastructure only arrive from TRL 9. The trough sits at 7-8.",src:"TNI p4-5"},
  {at:"demo",p:"lessor",q:"Why will an equipment lessor fund your demo when a bank won't?",o:["It holds a lien on resellable equipment, not on whether your process works","It is subsidised by the government","It charges no interest"],why:"Equipment finance avoids the binary does-it-work risk. Solugen and Via funded up to a third of their demos this way.",src:"OCED p17"},
  {at:"demo",p:"infragrowth",q:"Across 30 European FOAKs, the largest disclosed private source was:",o:["Strategic (corporate) equity","Venture capital","Commercial bank debt"],why:"Strategic equity contributed €605M across 10 plants; VC only €60M across 2.",src:"AFRY p16-17"},
  {at:"demo",p:"pfbank",q:"Being 'bankable', not just 'financeable', requires:",o:["Offtake, EPC contracts, collateral and credit enhancement","A great team and a big VC round","A grant award"],why:"Financeable means you can raise grants and equity; bankable means cheap debt, which depends on external prerequisites.",src:"TUM p21"},
  {at:"dev",p:"pfbank",q:"Typical loan-to-value for FOAK project debt is:",o:["20-60%","about 80%, like solar","90% or more"],why:"FOAK lenders go to 20-60%, against roughly 80% for mature solar.",src:"OCED p19"},
  {at:"dev",p:"pfbank",q:"What debt-service cover ratio do FOAK lenders typically demand?",o:["1.5-2× or more","1.0×","1.1-1.2×"],why:"FOAK lenders want 1.5-2×+, sometimes 3× with commodity exposure; mature projects need 1.2-1.5×.",src:"OCED p19"},
  {at:"dev",p:"ie",q:"What contingency should a FOAK carry?",o:["25-30%","5-10%","10-15%"],why:"10-15% is what's usually modelled, and AFRY calls it too optimistic. Lenders expect 25-30% at FOAK.",src:"OCED p19; AFRY p15"},
  {at:"dev",p:"publender",q:"Who has led FOAK project lending so far?",o:["Government-backed lenders: DOE LPO, EIB, export credit agencies","Commercial banks","Pension funds"],why:"FOAK project lending has been dominated by government-backed agencies, with 2+ years of diligence.",src:"OCED p19"},
  {at:"close",p:"ie",q:"Of 16 European FOAKs with data, how many overran capex?",o:["10","3","16"],why:"10 of 16 overran, two by more than 80%.",src:"AFRY p15"},
  {at:"close",p:"ie",q:"Business cases assume 6-12 months of ramp-up. What's common in reality?",o:["About 3 years","About 3 months","About 12 months"],why:"A significant share of FOAKs need about three years; 61% ran 12+ months late.",src:"AFRY p12"},
  {at:"close",p:"infragrowth",q:"Which of these is NOT one of BCG's three capital-allocation errors?",o:["Grants at pilot stage","Venture equity absorbing project execution risk","Senior debt entering before downside is bounded"],why:"BCG's three errors: venture equity taking execution risk, senior debt before downside is bounded, infrastructure capital before operating proof.",src:"BCG p10"},
  {at:"close",p:"epc",q:"Why do EPC contractors avoid first-of-a-kind risk?",o:["They work on 1-3% margins","They aren't allowed to by law","They're paid in equity"],why:"With 1-3% margins, one bad FOAK can wipe out years of profit, so EPCs avoid untested technology.",src:"TNI p3"},
  {at:"dev",p:"buyer",sector:["biochem"],q:"How much green premium will bio-based chemical buyers realistically pay?",o:["5-10%","50%+","They pay any premium for green"],why:"Realistically 5-10%, mostly from consumers, while many products cost 2-3× their fossil equivalents.",src:"EIB p18-19"},
  {at:"demo",p:"reg",sector:["pf"],q:"How long does EU Novel Food approval typically take?",o:["2-6+ years","6 months","Under a year"],why:"EFSA takes 2-6+ years, 1-3 years longer than the US route.",src:"Invest-NL Agrifood p40"}
];
function pickQuiz(k){
  const pool=QUIZ.filter((q,i)=>q.at===k&&(!q.sector||q.sector.includes(S.sector))&&!S.usedQ.includes(i));
  if(!pool.length)return null;
  const sec=pool.filter(q=>q.sector);const q=sec.length?sec[0]:pool[Math.floor(Math.random()*pool.length)];
  const idx=QUIZ.indexOf(q);const order=q.o.map((_,i)=>i).sort(()=>Math.random()-.5);
  return{...q,idx,order};
}

/* ---------------- Interludes ---------------- */
function startInterlude(k){
  const d=pickDilemma(k),q=pickQuiz(k);let bonus=false;
  if(k==="close"&&S.cred>=2&&!S.credBonus){S.credBonus=true;S.res+=1;bonus=true;toast("+1 ♥ RESERVE ACCOUNT","good");sfx("up");}
  if(!d&&!q){nextStage();return;}
  if(d)S.usedD.push(d.id);if(q)S.usedQ.push(q.idx);
  S.inter={k,d,q,step:d?"d":"q",pick:null,ans:null,bonus};
  render();window.scrollTo(0,0);
}
function dVerdict(c){return c.vFor?c.vFor(S):c.v;}
function interScreen(){
  const I=S.inter;let h="";
  if(I.bonus)h+=`<div class="feedback good fade">${chip("good")}<span class="lesson"><b>Credibility pays.</b> You answered the committees well, so your lenders agree a debt-service reserve account: +1 resilience.</span></div>`;
  if(I.step==="d"){
    const d=I.d;
    h+=`<div class="story fade"><span class="eyebrow">Month ${Math.round(S.month)} · Conflict</span><h2>${esc(d.title)}</h2></div>`;
    h+=`<div class="convo">${d.setup.map(([pk,t])=>bubble(P[pk],t,false)).join("")}</div>`;
    const ch=d.choices.filter(c=>!c.show||c.show(S));
    if(I.pick==null){
      h+=`<p>What do you do?</p><div class="cards">${ch.map((c,i)=>`<button class="card" data-dil="${i}"><span class="t">${esc(c.label)}</span></button>`).join("")}</div>`;
    }else{
      const c=ch[I.pick],v=dVerdict(c);
      h+=`<div class="feedback fade ${({good:"good",ok:"ok",bad:"bad"})[v]}"><div class="convo">${bubble(P.you,c.label+".",true)}${bubble(P[c.reply[0]],c.reply[1],false)}</div><div class="why">${chip(v)}<span class="lesson"><b>Why:</b> ${esc(c.lesson)}</span><span class="src">${esc(c.src)}</span></div></div>
      <div class="row"><button class="btn" id="interNext">${I.q?"Next: committee question":"Continue"}</button></div>`;
    }
  }else{
    const q=I.q,asker=P[q.p];
    h+=`<div class="story fade"><span class="eyebrow">Month ${Math.round(S.month)} · Committee question</span><h2>Can you answer this?</h2><p>Right answers build credibility (★). Get two of the first three right and your lenders grant a reserve account.</p></div>`;
    h+=`<div class="convo">${bubble(asker,q.q,false)}</div>`;
    if(I.ans==null){
      h+=`<div class="cards">${q.order.map(i=>`<button class="card" data-quiz="${i}"><span class="t">${esc(q.o[i])}</span></button>`).join("")}</div>`;
    }else{
      const right=I.ans===0;
      h+=`<div class="cards">${q.order.map(i=>`<button class="card ${i===0?"res-good":i===I.ans?"res-bad":"res-neutral"}" disabled>${i===0?chip("good"):i===I.ans?`<span class="chip bad">Your answer</span>`:""}<span class="t">${esc(q.o[i])}</span></button>`).join("")}</div>
      <div class="feedback fade ${right?"good":"bad"}"><div class="convo">${bubble(asker,right?"Correct. "+q.why:"Not quite. "+q.why,false)}</div><span class="src">${esc(q.src)}</span></div>
      <div class="row"><button class="btn" id="interNext">Continue</button></div>`;
    }
  }
  return h;
}
function bindInter(){
  app.querySelectorAll("[data-dil]").forEach(b=>b.onclick=()=>{
    const I=S.inter,ch=I.d.choices.filter(c=>!c.show||c.show(S)),c=ch[+b.dataset.dil];
    I.pick=+b.dataset.dil;if(c.fx)c.fx(S);{const vv=dVerdict(c);sfx(vv==="good"?"up":vv==="bad"?"no":"blip");}
    record("Conflict",`${I.d.title} ${c.label}`,dVerdict(c),c.lesson,c.src);render();});
  app.querySelectorAll("[data-quiz]").forEach(b=>b.onclick=()=>{
    const I=S.inter;I.ans=+b.dataset.quiz;const right=I.ans===0;S.quizCount++;if(right){S.cred++;S.quizRight++;toast("+1 ★ CREDIBILITY","good");sfx("up");}else{toast("WRONG ANSWER","bad");sfx("no");}
    record("Quiz",I.q.q+" "+I.q.o[0],right?"good":"bad",I.q.why,I.q.src);render();});
  const n=document.getElementById("interNext");
  if(n)n.onclick=()=>{const I=S.inter;if(I.step==="d"&&I.q){I.step="q";render();window.scrollTo(0,0);}else{S.inter=null;nextStage();}};
}

/* ---------------- Market wire ---------------- */
const NEWS={
  pilot:[["Climate VC money is plentiful early on: VC was 47% of climate private capital raised in 2023, against 17% across all sectors.","TNI p5"],["1,600+ climate VC-backed startups compete for capital; hydrogen alone has 240, averaging about $30M each.","TNI p6"]],
  demo:[["Only 53.5% of companies get from demonstration to full commercial readiness, taking 6.1 years on average.","Road p10"],["Since the 2021 peak, deal sizes have fallen and investors favour capital-light scale-up: shared facilities, CMOs, brownfield.","Invest-NL Agrifood p39"]],
  dev:[["Northvolt files for bankruptcy in March 2025 despite raising about $9B.","TNI p26"],["83% of surveyed FOAKs report significant delays; 44% by a year or more.","Road p32"]],
  close:[["US climate VC and growth funding rose 27% in 2025; Europe fell 13%, and Series C rounds fell 32%.","BCG p5"],["Breakthrough Energy Catalyst reportedly winds down, leaving a project-finance gap for FOAKs.","BCG p5"]],
  build:[["EU battery gigafactories average more than 10 months of start-of-production delay.","Road p32"],["Stegra targets a three-year construction period for its Boden green steel plant.","OCED p22"]]
};
const NEWS_REGION={us:[["DOE terminates 223 projects worth over $7.5B (October 2025).","BCG p16"]],nordics:[["Stegra secures its environmental permit in 6 months, against a typical 5-10 years.","OCED p32"]],nl:[["Grid congestion and high energy prices push Dutch biotech manufacturing abroad.","Invest-NL Agrifood p41"]],france:[["Première Usine: 51 projects, over €1B invested from €240M of public money.","EIB p36"]],germany:[["German climate-tech interviewees: banks are risk-averse and unfamiliar with non-standard contracts.","TUM p18"]]};
function newsLine(k){
  S.news=S.news||{};
  if(!S.news[k]){const pool=[...(NEWS[k]||[])];if(k==="dev"||k==="close")pool.push(...(NEWS_REGION[S.region]||[]));S.news[k]=pool[Math.floor(Math.random()*pool.length)];}
  const [t,s]=S.news[k];return `<p class="wire"><span class="eyebrow">Market wire</span> ${esc(t)} <span class="src">${esc(s)}</span></p>`;

/* ---------------- End-of-game extras ---------------- */
function badges(){
  const d=S.decisions,f=S.flags,has=(re,v)=>d.some(x=>re.test(x.label)&&(!v||x.v===v));
  const stack=(S.foakStack||[]).map(s=>s.id);
  const list=[
    ["Three-legged stool","VC, a corporate partner and public money all in your stack",(has(/Series A|Series B/,"good"))&&(f.strategicPartner||f.stratEquity)&&(has(/grant|award|aid|Première/i,"good"))],
    ["Bankable","Closed senior project debt",stack.includes("senior")],
    ["Capital-light","Used shared facilities and equipment leasing",has(/^Run the pilot at/,"good")&&has(/Equipment lease/,"good")],
    ["No traps","Never fell for a trap",!d.some(x=>x.v==="trap")],
    ["Diplomat","Resolved every conflict the right way",d.filter(x=>x.stage==="Conflict").every(x=>x.v==="good")&&d.some(x=>x.stage==="Conflict")],
    ["Know your numbers","Answered every committee question correctly",S.quizCount>0&&S.quizRight===S.quizCount],
    ["Local hero","Used your region's specialty instrument",(REGIONS[S.region].closeExtra&&stack.includes(REGIONS[S.region].closeExtra.id))||(S.region==="germany"&&f.ccfd)],
    ["Survivor","Reached commercial operation with one resilience point left",!S.failed&&S.res===1]
  ];
  return list.filter(b=>b[2]);
}
function finalScore(pct){
  if(S.failed)return Math.round(pct*2+S.quizRight*20);
  return Math.round(400+pct*3+Math.min(S.stake,40)*4+S.quizRight*25-Math.max(0,S.month-110)*2);
}
function endExtras(pct){
  const sc=finalScore(pct),key=`foak-best-${S.sector}-${S.region}-${S.diff}`;let best=null,isNew=false;
  try{best=+localStorage.getItem(key)||null;if(!best||sc>best){localStorage.setItem(key,sc);isNew=!!best||true;}}catch(e){}
  const b=badges();
  const R=REGIONS[S.region],n=N();
  const path=[
    ["Pilot",`${n.grantSmall} + specialist VC + ${SEC().N.partnerSite}`],
    ["Demo",`VC syndicate + strategic equity with a joint development agreement + ${n.grantDemo} + equipment lease`],
    ["Development",`Binding take-or-pay offtake, an experienced owner team, multi-package EPC with performance guarantees, independent engineer, 25-30% contingency${S.region==="germany"?", a carbon contract for difference":""}`],
    ["FOAK close",`Grant + catalytic first loss + offtaker and project equity in the SPV${R.closeExtra?` + ${R.closeExtra.label.toLowerCase()}`:""} + ${n.govLoan} + senior bank debt`],
    ["Construction","Mitigations prepared before FID; strategic partners and flexible public lenders as backstops"]
  ];
  const mistakes=S.decisions.filter(x=>(x.v==="trap"||x.v==="bad")&&x.stage!=="Quiz").slice(0,3);
  return `<div class="grid2"><div class="stat"><span class="k">Score</span><span class="v">${sc}</span></div><div class="stat"><span class="k">Best · ${esc(R.name)} · ${esc(DF().name)}</span><span class="v">${best&&best>sc?best:sc}${(!best||sc>=best)?" ★":""}</span></div><div class="stat"><span class="k">Committee ★</span><span class="v">${S.quizRight}/${S.quizCount}</span></div><div class="stat"><span class="k">Badges</span><span class="v">${b.length}/8</span></div></div>
  ${b.length?`<div class="badges">${b.map(x=>`<span class="badge" title="${esc(x[1])}"><b>${esc(x[0])}</b> ${esc(x[1])}</span>`).join("")}</div>`:""}
  ${mistakes.length?`<div class="story"><span class="eyebrow">Your three biggest lessons</span>${mistakes.map(m=>`<p class="note"><b>${esc(m.label)}.</b> ${esc(m.lesson)} <span class="src">${esc(m.src)}</span></p>`).join("")}</div>`:""}
  <div class="story"><span class="eyebrow">Textbook path · ${esc(SEC().name)} in ${esc(R.name)}</span><div class="path">${path.map(([a,t])=>`<div><b>${a}</b><span>${esc(t)}</span></div>`).join("")}</div><p class="src">Synthesis of TNI p7-9; TUM p21; BCG p9-12; OCED p14-20; AFRY p30-31</p></div>`;
}

function guideBox(k){
  const g=GUIDE[k];if(!g)return "";
  const wide=(window.matchMedia&&matchMedia("(min-width: 1000px)").matches);
  const open=(S.guideOpen!=null?S.guideOpen:wide)?"open":"";
  return `<details class="guide" ${open}><summary>Field guide · ${STAGE_NAMES[k]}</summary><div class="gbody">${g.map(x=>`<div class="gitem"><h3>${esc(x.t)}</h3><p>${esc(x.d)}</p><span class="src">${esc(x.src)}</span></div>`).join("")}</div></details>`;
}

function drawSprite(cv,name,scale){

/* particles: drawn at 1/4 resolution and scaled up, so every particle is a chunky pixel */
let parts=[],raf=null,pFrame=0,pMode=null;
const PCOL=["#ffcd75","#ef7d57","#b13e53","#a7f070","#38b764","#41a6f6","#73eff7","#f4f4f4"];
function startParticles(kind,sad){
  stopParticles();fxP.width=Math.ceil(innerWidth/4);fxP.height=Math.ceil(innerHeight/4);
  parts=[];pFrame=0;pMode={kind,sad};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  raf=requestAnimationFrame(tick);
}
function stopParticles(){if(raf)cancelAnimationFrame(raf);raf=null;parts=[];const x=fxP.getContext("2d");x.clearRect(0,0,fxP.width,fxP.height);}
function add(p){parts.push(Object.assign({vx:0,vy:0,g:0,s:1,life:200,c:"#f4f4f4"},p));}
function tick(){
  const W=fxP.width,H=fxP.height,cx=W/2,cy=H*0.42,k=pMode.kind,f=pFrame++;
  if(pMode.sad){if(f%2===0)add({x:Math.random()*W,y:-2,vy:1.6,s:1,c:"#41a6f6",life:H});}
  else{
    if(f<90&&f%2===0)add({x:Math.random()*W,y:-2,vx:(Math.random()-.5)*.4,vy:.4+Math.random()*.5,s:Math.random()<.3?2:1,c:PCOL[f%PCOL.length],life:H*2});
    if(k==="shovel"&&f%34===0)for(let i=0;i<12;i++)add({x:cx+(Math.random()-.5)*6,y:cy+14,vx:(Math.random()-.5)*2.4,vy:-1-Math.random()*1.6,g:.07,s:Math.random()<.5?2:1,c:Math.random()<.5?"#7a4a2a":"#c4834a",life:90});
    if((k==="moneybag"||k==="bank")&&f%3===0&&f<240)add({x:Math.random()*W,y:-3,vy:.8+Math.random()*.6,s:2,c:Math.random()<.7?"#ffcd75":"#ef7d57",life:H*2});
    if(k==="factory"&&f%8===0)add({x:cx+10+(Math.random()-.5)*2,y:cy-14,vx:.15+Math.random()*.2,vy:-.35,s:2,c:Math.random()<.5?"#94b0c2":"#566c86",life:120});
    if(k==="flask"&&f%6===0)add({x:cx+(Math.random()-.5)*8,y:cy,vy:-.5-Math.random()*.4,s:1,c:"#a7f070",life:110});
    if((k==="trophy"||k==="contract")&&f%28===0){const bx=W*(.15+Math.random()*.7),by=H*(.1+Math.random()*.3),col=PCOL[Math.floor(Math.random()*PCOL.length)];
      for(let i=0;i<22;i++){const a=i/22*Math.PI*2;add({x:bx,y:by,vx:Math.cos(a)*1.3,vy:Math.sin(a)*1.3,g:.03,s:1,c:col,life:55});}}
  }
  const x=fxP.getContext("2d");x.clearRect(0,0,W,H);
  parts=parts.filter(p=>p.life-->0&&p.y<H+4);
  for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);}
  raf=requestAnimationFrame(tick);
}

function tone(f,t0,d,type,vol,f2){const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}

  if(S){S.newCards=S.newCards||[];if(!wasSeen&&!S.newCards.includes(c.id))S.newCards.push(c.id);}
  if(!wasSeen)setTimeout(()=>{toast(`NEW CARD: ${c.n.toUpperCase()}`,"good");sfx("blip");},450);
  else if(e.m&&!wasM)setTimeout(()=>{toast(`★ CARD MASTERED: ${c.n.toUpperCase()}`,"good");sfx("up");},450);
}
const collCount=()=>({seen:CARDS.filter(c=>COLL[c.id]&&COLL[c.id].seen).length,m:CARDS.filter(c=>COLL[c.id]&&COLL[c.id].m).length,all:CARDS.length});
function cardsBtn(){const k=collCount();return `<button class="snd cardsbtn" data-binder="1">CARDS ${k.seen}/${k.all}</button>`;}

/* binder overlay */
const binder=document.createElement("div");binder.id="binder";binder.hidden=true;binder.setAttribute("role","dialog");binder.setAttribute("aria-modal","true");binder.setAttribute("aria-label","Card binder");
document.body.appendChild(binder);
let bFilter="All",bOpenCard=null,bResetArm=false,bPrevFocus=null;
const BFILTERS=["All","Equity","Debt","Public","Risk tools","Regional","Traps"];
function inFilter(c){if(bFilter==="All")return true;if(bFilter==="Equity")return c.t==="Equity";if(bFilter==="Debt")return c.t==="Debt";
  if(bFilter==="Public")return ["grant","gov","sov","investnl","spi","ccfd","taxcredit"].includes(c.id);if(bFilter==="Risk tools")return ["Insurance","Guarantee","Revenue"].includes(c.t)||c.t==="Structure";
  if(bFilter==="Regional")return !!c.region;if(bFilter==="Traps")return c.r==="Trap";return true;}
function bars(n){return `<span class="cbars" aria-label="${n} of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;}
function miniCard(c){
  const e=COLL[c.id]||{},T=CTYPE[c.t];
  if(!e.seen)return `<button class="ccard locked" data-card="${c.id}" aria-label="Locked card: ${esc(c.t)}"><canvas data-sprite="locked" data-scale="4"></canvas><span class="cname">???</span><span class="ctype">${esc(c.t)}${c.region?" · "+esc(c.region):""}</span></button>`;
  return `<button class="ccard ${e.m?"mastered":""} r-${c.r.toLowerCase()}" data-card="${c.id}" style="--tc:${T.c}"><span class="crar">${esc(c.r)}${e.m?" · ★":""}</span><canvas data-sprite="${c.spr||T.spr}" data-scale="4"></canvas><span class="cname">${esc(c.n)}</span><span class="ctype">${esc(c.t)}${c.region?" · "+esc(c.region):""}</span></button>`;
}
function bigCard(c){
  const e=COLL[c.id]||{},T=CTYPE[c.t];
  return `<div class="cbig ${e.m?"mastered":""} r-${c.r.toLowerCase()}" style="--tc:${T.c}">
    <div class="chead"><span class="crar">${esc(c.r)} · ${esc(c.t)}${c.region?" · "+esc(c.region):""}</span>${e.m?`<span class="cm">★ MASTERED</span>`:""}</div>
    <div class="ctop"><canvas data-sprite="${c.spr||T.spr}" data-scale="7"></canvas><h3>${esc(c.n)}</h3></div>
    <div class="cstats"><div><span>Risk appetite</span>${bars(c.st[0])}</div><div><span>Cost to you</span>${bars(c.st[1])}</div><div><span>Ticket size</span>${bars(c.st[2])}</div></div>
    <dl><dt>Who</dt><dd>${esc(c.who)}</dd><dt>Right moment</dt><dd>${esc(c.best)}</dd><dt>Takes</dt><dd>${esc(c.takes)}</dd><dt>Refuses</dt><dd>${esc(c.refuses)}</dd><dt>Trap</dt><dd>${esc(c.trap)}</dd></dl>
    <span class="src">${esc(c.src)} · stats are stylised game values</span>
    ${e.m?"":`<p class="chint">Master it: ${c.trapCard?"meet it in a game to learn its lesson.":"use it at the right moment in a game."}</p>`}
  </div>`;
}
function renderBinder(){
  const k=collCount();
  const list=CARDS.filter(inFilter);
  let body;
  if(bOpenCard){const c=CARDS.find(x=>x.id===bOpenCard);body=`<button class="btn ghost" id="bBack">◀ Back to binder</button>${bigCard(c)}`;}
  else body=`<div class="bfilters" role="tablist">${BFILTERS.map(f=>`<button class="snd ${f===bFilter?"on":""}" role="tab" aria-selected="${f===bFilter}" data-bf="${f}">${f}</button>`).join("")}</div>
    <div class="cgrid">${list.map(miniCard).join("")}</div>
    <div class="row"><button class="snd" id="bReset">${bResetArm?"Click again to wipe all cards":"Reset collection"}</button></div>`;
  binder.innerHTML=`<div class="bpanel"><div class="bhead"><div><span class="eyebrow">Card binder</span><h2>${k.seen}/${k.all} collected · ${k.m} ★ mastered</h2></div><button class="btn" id="bClose">Close ✕</button></div>
    <p class="bintro">Every financing instrument you meet becomes a card. Use it at the right moment to master it. Your collection is saved in this browser across games.</p>${body}</div>`;
  binder.querySelectorAll("canvas[data-sprite]").forEach(cv=>drawSprite(cv,cv.dataset.sprite,+cv.dataset.scale||4));
  binder.querySelector("#bClose").onclick=closeBinder;
  binder.querySelectorAll("[data-bf]").forEach(b=>b.onclick=()=>{bFilter=b.dataset.bf;renderBinder();});
  binder.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>{const c=CARDS.find(x=>x.id===b.dataset.card);if(!(COLL[c.id]&&COLL[c.id].seen)){toast("LOCKED: MEET IT IN A GAME","bad");sfx("no");return;}bOpenCard=c.id;renderBinder();binder.scrollTop=0;sfx("blip");});
  const bb=binder.querySelector("#bBack");if(bb){bb.onclick=()=>{bOpenCard=null;renderBinder();};bb.focus();}
  const br=binder.querySelector("#bReset");if(br)br.onclick=()=>{if(bResetArm){COLL={};saveColl();bResetArm=false;}else bResetArm=true;renderBinder();};
}
function openBinder(cardId){bOpenCard=cardId||null;bFilter="All";bResetArm=false;bPrevFocus=document.activeElement;binder.hidden=false;document.body.classList.add("noscroll");renderBinder();binder.scrollTop=0;const c=binder.querySelector("#bClose");if(c&&!cardId)c.focus();sfx("blip");}
function closeBinder(){binder.hidden=true;document.body.classList.remove("noscroll");bOpenCard=null;if(typeof render==="function")render();if(bPrevFocus&&bPrevFocus.isConnected)bPrevFocus.focus();}
document.addEventListener("keydown",e=>{if(!binder.hidden&&e.key==="Escape"){if(bOpenCard){bOpenCard=null;renderBinder();}else closeBinder();}});
function newCardsBlock(){
  const ids=(S&&S.newCards)||[];if(!ids.length)return "";
  return `<div class="story"><span class="eyebrow">New cards this run · ${ids.length}</span><div class="cgrid">${ids.map(id=>miniCard(CARDS.find(c=>c.id===id))).join("")}</div><div class="row"><button class="btn ghost" data-binder="1">Open card binder</button></div></div>`;
}

</script>

   run:(sel)=>{S.flags.perfGuarantees=true;if(sel.includes("team")||S.flags.team)return{v:"good",lesson:"Stegra combined unit-rate packages with creditworthy performance guarantees from thyssenkrupp nucera, Midrex and SMS. An experienced owner team makes this work.",src:"OCED p17, p20, p32"};
     S.flags.interfaceRisk=true;return{v:"ok",lesson:"Performance guarantees are in place, but without an experienced owner team nobody owns the interfaces between packages.",src:"OCED p20; AFRY p14"}}},
  {id:"site",label:n.site,months:4,
   run:()=>{S.flags.site=true;return{v:"good",lesson:S.sector==="pf"?"EU Novel Food approval takes 2-6+ years, 1-3 years longer than the US. Filing early and launching in the US first is common practice.":"Permitting and external interfaces cause most FOAK delays. Brownfield sites, early permits and secured utilities shorten them.",src:S.sector==="pf"?"Invest-NL Agrifood p40":"AFRY p14, p27; BCG p9"}}},
  {id:"ie",label:"Independent engineer review plus a lender-grade techno-economic model",months:3,

  {id:"contingency",label:"Budget 25-30% contingency and a three-year ramp-up case (+15% capex budget)",months:1,
   run:()=>{S.flags.contingency=true;S.capexMult*=1.15;return{v:"good",lesson:"10 of 16 European FOAKs overran capex and 61% ramped up 12+ months late. Lenders expect 25-30% contingency at FOAK, double the mature norm.",src:"AFRY p12, p15; OCED p19"}}},
  {id:"bigGrant",label:`Apply for the ${n.grantBig}`,months:9,
   run:()=>{S.flags.bigGrant=true;return{v:"good",lesson:"Large grants take 15-20+ person-months and a long evaluation. Time the application against your maturity gates so the award lands before FID.",src:"EIB p49; AFRY p30"}}},
  {id:"tpi",label:"Technology performance insurance",months:3,
   run:()=>{if(S.flags.skippedDemo)return{v:"bad",rejected:true,lesson:"Insurers need runtime data, thousands of continuous hours of it. Without a demo you have none, so no insurer will quote.",src:"Road p56"};
     S.flags.tpi=true;return{v:"good",lesson:"Brightmark's performance insurance enabled $185M of green bonds. Insurers wrap risks once they are measurable.",src:"Road p56-57"}}}

/* ---------------- Tips (Tailwinds only) ---------------- */
const TIPS={
  pilot:"Pilot stage is about proving the process works. Who takes technology risk? Who wants cash flow you don't have yet?",
  demo:"Demo is the ~10× step that proves the integrated system. Line up the people who will later buy your product. Banks and infrastructure funds are still too early.",
  dev:"In the next stage, lenders will check for binding offtake, a construction risk allocation (an EPC wrap or performance guarantees), an independent engineer review, and a team that has built plants. Big grants need to be applied for now.",
  close:"Stack capital by risk layer: grants and first-loss at the bottom, project equity, then public and commercial debt. Lenders want at least ~30% equity or grants beneath their debt.",
};

/* ---------------- Rendering helpers ---------------- */
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chip=v=>{const m={good:["good","Right instrument, right moment"],ok:["ok","Works, with a trade-off"],bad:["bad","Wrong moment"],trap:["bad","Trap"],neutral:["neutral","Accepted"],costly:["ok","Costly fix"]};const [c,t]=m[v]||m.neutral;return `<span class="chip ${c}">${t}</span>`;};
function visibleVerdict(v){ if(v==="trap"&&S.diff!=="easy")return "neutral"; if(v==="bad"&&S.diff==="hard")return v; return v; }
function resClass(v){return {good:"res-good",ok:"res-ok",bad:"res-bad",trap:"res-bad",neutral:"res-neutral"}[v]||"";}

function ledger(){
  if(!S||S.phase!=="play")return "";
  const steps=STAGES.map((k,i)=>`<span class="${i<S.stage?"done":i===S.stage?"now":""}"></span>`).join("");
  const hearts="♥".repeat(Math.max(S.res,0))+"♡".repeat(Math.max(DF().res-S.res,0));
  return `<div class="ledger"><div class="steps" aria-hidden="true">${steps}</div>
  <span><b>${esc(S.name)}</b> <span class="k">· ${SEC().name} · ${REGIONS[S.region].name}</span></span>
  <span><span class="k">Stage </span><b>${STAGE_NAMES[STAGES[S.stage]]}</b></span>
  <span><span class="k">Month </span><b>${Math.round(S.month)}</b></span>
  <span><span class="k">Founder stake </span><b>${S.stake.toFixed(1)}%</b></span>
  <span title="Committee credibility"><span class="k">Credibility </span><b>${"★".repeat(S.cred)||"–"}</b></span>
  <span title="Resilience: how many unmitigated shocks your project can survive"><span class="k">Resilience </span><b class="hearts">${hearts}</b></span>${cardsBtn()}${sndBtn()}</div>`;
}

const KIND_COLORS={equity:"var(--accent)",grant:"var(--good)",debt:"var(--warn)",reduce:"var(--muted)",spv:"var(--violet)"};
const KIND_NAMES={equity:"TopCo equity",grant:"Grant",debt:"Debt",reduce:"Capex avoided",spv:"Project-level equity"};
function stackBar(){
  const tot=Math.max(1,S.cover);
  const segs=S.stack.map((s,i,a)=>`<div class="${i===a.length-1&&S.lastPick===s.id?"grow":""}" style="width:${(s.cover/tot)*100}%;background:${KIND_COLORS[s.kind]}" title="${esc(s.label)}">${s.cover>=.12?Math.round(s.cover*100)+"%":""}</div>`).join("");
  const kinds=[...new Set(S.stack.map(s=>s.kind))];
  const legend=kinds.map(k=>`<span><i style="background:${KIND_COLORS[k]}"></i>${KIND_NAMES[k]}</span>`).join("");
  return `<div class="bar" role="img" aria-label="Funding raised: ${Math.round(S.cover*100)}% of need">${segs}</div>${legend?`<div class="bar-legend">${legend}</div>`:""}`;
}

/* ---------------- Screens ---------------- */
function render(){
  let h="";
  if(!S||S.phase==="intro")h=introScreen();
  else if(S.phase==="end")h=endScreen();
  else{
    const k=STAGES[S.stage];
    h=ledger()+`<div class="cols"><div class="main">${S.inter?interScreen():k==="dev"?devScreen():k==="build"?buildScreen():menuScreen(k)}</div>${guideBox(S.inter?S.inter.k:k)}</div>`;
  }
  app.className="wrap"+(S&&S.phase==="play"?" play":"");
  app.innerHTML=h;
  bind();
  paintSprites();
  checkMilestones();
}

let pickSector=null,pickDiff="normal",pickRegion=null,pickName="";
