  <p><b>Stylised numbers.</b> Amounts, valuations, probabilities, timelines and card stats are simplified for gameplay. Real deals vary widely.</p>
  <p><b>Not advice.</b> Nothing here is investment, legal, tax or financial advice.</p>
  <p><b>Privacy.</b> The game collects no data. Your best scores, card collection and sound setting are stored only in your own browser.</p>
  <p><b>Built on:</b></p><ul class="sources">${Object.values(SOURCES).map(v=>`<li>${esc(v)}</li>`).join("")}</ul>
  </div></details>`;
}
function introScreen(){
  const reg=Object.entries(REGIONS).map(([k,R])=>`<button class="card ${pickRegion===k?"sel":""}" data-region="${k}"><span class="t">${R.name}</span><span class="meta">${esc(R.tag)}</span></button>`).join("");
  const r=pickRegion&&REGIONS[pickRegion];
  const sec=Object.entries(SECTORS).map(([k,s])=>`<button class="card ${pickSector===k?"sel":""}" data-sector="${k}">
     <span class="t">${s.name}</span><span class="meta">${esc(s.tag)} · ${s.type} · FOAK ≈ ${fmt(s.need.foak)}</span></button>`).join("");
  const dif=Object.entries(DIFFS).map(([k,d])=>`<button class="card ${pickDiff===k?"sel":""}" data-diff="${k}"><span class="t">${d.name}</span><span class="meta">${esc(d.blurb)}</span></button>`).join("");
  const s=pickSector&&SECTORS[pickSector];
  return `<div class="story fade" style="padding-top:12px">
    <span class="eyebrow">A financing game · TRL 4 to commercial operation</span>
    <div class="hero" aria-hidden="true"><canvas data-sprite="lab" data-scale="6"></canvas><canvas data-sprite="factory" data-scale="6"></canvas><canvas data-sprite="moneybag" data-scale="5"></canvas></div>
    <h1>First of a Kind</h1>
    <p>You run a climate-tech startup with a working lab prototype and a stake of 60% after seed. Your job is to reach commercial operation of your first-of-a-kind plant. At each stage, pick the instruments that fit. Funders reject the wrong ones, and some traps only bite later. Between stages, your team, lenders and buyers will disagree, and committees will test what you know.</p>
  </div>
  <div class="story"><span class="eyebrow">1 · Choose your sector</span><div class="cards two">${sec}</div>
  ${s?`<p class="note"><b>${s.type}.</b> ${esc(s.note)}</p>`:""}</div>
  <div class="story"><span class="eyebrow">2 · Choose where to build</span><div class="cards two">${reg}</div>
  ${r?`<p class="note"><b>${r.name}.</b> ${esc(r.note)} <span class="src">${esc(r.src)}</span></p>`:""}</div>
  <div class="story"><span class="eyebrow">3 · Choose difficulty</span><div class="cards">${dif}</div></div>
  <div class="story"><label class="eyebrow" for="coName">4 · Name your company (optional)</label><input class="name" id="coName" maxlength="40" value="${esc(pickName||"")}" placeholder="${esc(pickSector?CO_NAMES[pickSector]:"e.g. Pixel Steel Co.")}"></div>
  <div class="row"><button class="btn" id="start" ${pickSector&&pickRegion?"":"disabled"}>Start company</button>${pickSector&&pickRegion?`<span class="press">PRESS START</span>`:""}${cardsBtn()}${sndBtn()}${pickSector&&pickRegion?"":`<span class="src">Pick a sector and a region first.</span>`}</div>
  ${aboutBlock(false)}`;
}

function stageIntro(k){
  const s=SEC(),n=need();
  const txt={
    pilot:`Your lab results are in. Next: a pilot that proves the process runs under operating conditions (TRL 4-6). You need about <b>${fmt(n)}</b>.`,
    demo:`The pilot works. Now the ~10× step: a demo plant that proves the integrated system (TRL 6-7). You need about <b>${fmt(n)}</b>.`,
    close:`Development is done. Time to fund the FOAK itself: about <b>${fmt(n)}</b>${S.capexMult>1?` (including your budget choices)`:""}. Build a capital stack that covers 100%.`
  }[k];
  return `<div class="story fade"><span class="eyebrow">Month ${Math.round(S.month)} · ${STAGE_NAMES[k]}</span><div class="lvl"><canvas data-sprite="${{pilot:"flask",demo:"factory",close:"moneybag"}[k]}" data-scale="4" aria-hidden="true"></canvas><h2>${{pilot:"Prove the process",demo:"Prove the system",close:"Close the FOAK financing"}[k]}</h2></div><p>${txt}</p>
  ${k==="close"?`<div class="real"><div class="eyebrow">How it was done · ${s.name}</div>${esc(s.real)} <span class="src">${s.realSrc}</span></div>`:""}
  ${newsLine(k)}${DF().tips&&TIPS[k]?`<p class="note"><b>Advisor:</b> ${TIPS[k]}</p>`:""}</div>`;
}

function optionsFor(k){return k==="pilot"?pilotOptions():k==="demo"?demoOptions():closeOptions();}

function menuScreen(k){
  const opts=optionsFor(k), n=need();
  const cards=opts.map(o=>{
    const r=S.picked[o.id];
    const amt=o.kind==="skip"?"":`${o.kind==="reduce"?"Cuts need by":"Up to"} ${fmt(((r&&r.cover)||o.cover)*n)}`;
    let cost="";
    if(o.kind==="equity"){const pre=SEC().pre[k==="close"?"foak":k];const a=o.cover*n;cost=` · dilution ≈ ${(a/(pre+a)*100).toFixed(0)}% of TopCo`;}
    if(o.kind==="spv")cost=" · no TopCo dilution";
    if(o.months)cost+=` · +${o.months} mo`;
    const req=DF().showReq?`<span class="meta">Needs: ${esc(o.req)}</span>`:"";
    const status=r?`${chip(visibleVerdict(r.v))}`:"";
    return `<button class="card ${r?resClass(visibleVerdict(r.v)):""} ${r&&r.cover===0?"rejected":""} ${S.lastPick===o.id?"just":""}" data-opt="${o.id}" ${r?"disabled":""}>
      ${status}<span class="t">${esc(o.label)}</span>${WHAT[k+"."+o.id]?`<span class="what">${esc(WHAT[k+"."+o.id])}</span>`:""}<span class="meta">${esc(o.who)}${amt?" · "+amt:""}${cost}</span>${req}</button>`;
  }).join("");
  const fb=S.feedback?feedbackBox(S.feedback):"";
  const pct=Math.round(S.cover*100);
  let err="";
  if(k==="close")err=closeCheck();
  const canDone=S.cover>=0.999&&!err;
  return stageIntro(k)+`<div class="need"><div class="row" style="justify-content:space-between"><span class="eyebrow">Funded ${pct}% of ${fmt(n)}</span></div>${stackBar()}</div>
  ${fb}<div class="cards">${cards}</div>
  ${err&&S.cover>=0.999?`<p class="err">${err}</p>`:""}
  <div class="row">${S.stack.length?`<button class="btn ghost" id="resetRound">Restart this round</button>`:""}<button class="btn" id="done" ${canDone?"":"disabled"}>${k==="close"?"Sign financial close":"Close the round"}</button><span class="src">${canDone?"":S.cover<0.999?`Cover at least 100% to continue.`:""}</span></div>`;
}

function closeCheck(){
  const has=id=>S.stack.find(s=>s.id===id);
  const debt=S.stack.filter(s=>["senior","gov","sov","vdebt"].includes(s.id)).reduce((a,s)=>a+s.cover,0);
  if(debt>.7)return "Too much debt: FOAK lenders go to 20-60% loan-to-value, and even Stegra with sovereign guarantees was about 60% debt. Use Restart this round and swap a debt tranche for equity.";
  if(!has("senior"))return "";
  const cushion=S.stack.filter(s=>["projEq","stratEq","super","catalytic","grant","sellout"].includes(s.id)).reduce((a,s)=>a+s.cover,0);
  if(cushion<.25)return "The banks want at least ~30% equity or grants beneath their debt. Add more equity-like capital.";
  return "";
}

function feedbackBox(fb){
  const v=visibleVerdict(fb.v);
  const cls={good:"good",ok:"ok",bad:"bad",trap:"bad",neutral:""}[v];
  const body=(v==="neutral")?(fb.now||"Accepted."):(fb.now&&S.diff==="easy"?fb.now+" ":"")+fb.lesson;
  return `<div class="feedback fade ${cls}" role="status">${convo(fb.talk)}<div class="why">${chip(v)}<span class="lesson"><b>${esc(fb.label)}.</b> ${fb.ok===false?"<b>Rejected.</b> ":""}${v==="neutral"?"":"<b>Why:</b> "}${esc(body)}</span>${v!=="neutral"?`<span class="src">${esc(fb.src)}</span>`:""}</div></div>`;
}

function chooseOption(id){
  const k=STAGES[S.stage];
  const o=optionsFor(k).find(x=>x.id===id);
  const res=o.run(o);
  const cover=o.cover;
  S.picked[id]={v:res.v,cover};
  S.feedback={...res,label:o.label,talk:talkFor(k+"."+o.id,res)};
  record(STAGE_NAMES[k],o.label,res.v,res.lesson,res.src);collectCard(k+"."+o.id,res.v);
  if(res.ok===false){S.month+=res.months||0;S.picked[id].cover=0;S.lastPick=id;sfx("no");toast("REJECTED","bad");render();return;}
  if(res.skip){S.month+=6;startInterlude("demo");return;}
  S.month+=(o.months||0)*0.5;
  const n=need();
  if(o.kind==="equity")dilute(cover*n,SEC().pre[k==="close"?"foak":k]);
  S.cover+=cover;S.stack.push({id,label:o.label,kind:o.kind,cover});S.lastPick=id;
  fxOnFund(o,id,cover*n);
  render();
}

function stageDone(){
  const k=STAGES[S.stage];
  S.month+=({pilot:18,demo:30,close:6}[k]);
  if(k==="demo"&&S.flags.earlyBank){S.pendingBankShock=true;}
  if(k==="close")S.foakStack=S.stack.slice();
  stageCelebrate(k);
  startInterlude(k);
}
function nextStage(skipped){
  if(skipped){S.month+=6;}
  S.stage+=1;S.lastPick=null;S.cover=0;S.stack=[];S.picked={};S.feedback=null;S.devSel=[];S.devResults=null;
  if(STAGES[S.stage]==="build")setupEvents();
  snap();
  render();window.scrollTo(0,0);
}

/* ---------------- Dev stage ---------------- */

  if(S.devResults){
    const lines=S.devResults.map(r=>{const vv=visibleVerdict(r.v);return `<div class="feedback ${({good:"good",ok:"ok",bad:"bad",trap:"bad"})[vv]||""}">${convo(r.talk)}<div class="why">${chip(vv)}<span class="lesson"><b>${esc(r.label)}.</b> ${vv==="neutral"?"Done.":"<b>Why:</b> "+esc(r.lesson)}</span>${vv!=="neutral"?`<span class="src">${esc(r.src)}</span>`:""}</div></div>`;}).join("");
    return `<div class="story fade"><span class="eyebrow">Month ${Math.round(S.month)} · Pre-FID development</span><h2>Workstreams complete</h2><p>Development took ${S.devMonths} months, funded by an insider bridge (≈4% dilution).</p></div>${lines}<div class="row"><button class="btn" id="devNext">Go to financial close</button></div>`;
  }
  const cards=opts.map(o=>{const sel=S.devSel.includes(o.id);return `<button class="card ${sel?"sel":""}" data-dev="${o.id}" aria-pressed="${sel}"><span class="t">${esc(o.label)}</span><span class="meta">${o.months} months</span></button>`;}).join("");
  return bankShock+`<div class="story fade"><span class="eyebrow">Month ${Math.round(S.month)} · Pre-FID development</span><div class="lvl"><canvas data-sprite="contract" data-scale="4" aria-hidden="true"></canvas><h2>Make the project financeable</h2></div>
  <p>${S.flags.skippedDemo?"You skipped the demo, so you go straight into development.":"The demo runs. Before anyone funds the FOAK,"} you have bandwidth for <b>${max} workstreams</b> over the next ~1.5 years. Workstreams run in parallel; the longest sets the pace.</p>
  ${newsLine("dev")}${DF().tips?`<p class="note"><b>Advisor:</b> ${TIPS.dev}</p>`:""}</div>
  <div class="cards">${cards}</div>
  <div class="row"><button class="btn" id="devGo" ${S.devSel.length===max?"":"disabled"}>Commit ${S.devSel.length}/${max} workstreams</button></div>`;
}
function bankShockBox(){
  return `<div class="feedback bad fade"><div class="convo">${bubble(P.regbank,"The demo is 35% over budget and three months late. That breaches our covenants, so we're calling the loan. I'm sorry, but credit committee won't wait.",false)}${bubble(P.you,"If you pull out now, nobody else will lend to us.",true)}${bubble(P.regbank,"That isn't something I can factor in.",false)}</div><div class="why">${chip("trap")}<span class="lesson"><b>The regional bank pulls out.</b> The demo ran 35% over budget and three months late. The bank called its loan, and other lenders read the exit as a red flag. You raise an emergency round at a lower valuation (−25% stake) and lose 9 months.</span><span class="src">Road p30; BCG p10</span></div></div>`;
}
function applyBankShock(){
  if(!S.pendingBankShock)return;
  S.pendingBankShock=false;S.stake*=.75;S.month+=9;
  record("Demo · consequence","Regional bank withdraws mid-build","costly","Bank debt that enters before the downside is bounded can walk away when trouble starts, and its exit scares off replacement capital.","Road p30; BCG p10");
}
function commitDev(){
  applyBankShock();
  const opts=devOptions();const sel=S.devSel.slice();
  sel.sort((a,b)=>(a==="team"?-1:b==="team"?1:0));
  const out=[];let maxM=0;
  sel.forEach(id=>{const o=opts.find(x=>x.id===id);const r=o.run(sel);maxM=Math.max(maxM,o.months);out.push({...r,label:o.label,talk:talkFor("dev."+id,r)});record("Development",o.label,r.v,r.lesson,r.src);collectCard("dev."+id,r.v);});
  S.devMonths=12+maxM;S.month+=S.devMonths;S.stake*=.96;S.devResults=out;render();
}

/* ---------------- Build stage ---------------- */
function setupEvents(){
  const p0=DF().p,f=S.flags,ev=[],r=Math.random,R=REGIONS[S.region],m=S.mods;const p={capex:p0.capex+m.capex,ramp:p0.ramp+m.ramp,policy:p0.policy+m.policy+(R.policyAdj||0),tech:p0.tech+m.tech};
  const overrun=[12,28,45,70,90][Math.floor(r()*r()*5)]+(S.diff==="hard"?10:0)+(f.rework?15:0);
  if(r()<p.capex)ev.push({id:"capex",title:`Capex comes in ${overrun}% over budget`,text:`Equipment for the scaled-up process costs more than estimated, and a redesign after construction start adds more. You are not alone: 10 of 16 European FOAKs overran, two by more than 80%.`,
    mit:f.contingency&&overrun<=30,mitText:"Your 25-30% contingency absorbs it.",partial:f.contingency&&overrun>30,months:6,src:"AFRY p15"});
  if(r()<p.ramp||f.shortDebt)ev.push({id:"ramp",title:"Ramp-up takes 20 months longer than planned",text:`The plant works, but reaching nameplate capacity takes far longer than the business case assumed. 61% of FOAKs ramped up 12+ months late.${f.shortDebt?" Your three-year venture debt falls due in the middle of it.":""}`,
    mit:(f.tpi||(f.contingency&&!f.strictCovenants))&&!f.shortDebt,mitText:f.tpi?"Your performance insurance covers debt service while output is below spec.":"You modelled a three-year ramp-up, and lenders sized the debt for it.",months:10,delay:true,src:"AFRY p12, p32"});
  if(f.loi&&!f.offtakeBinding)ev.push({id:"loi",title:"The letters of intent evaporate",text:"With the plant ready, half your LOI buyers say the price is too high or the timing has changed. There is nothing to enforce.",mit:false,months:8,src:"AFRY p21; EIB p19"});
  else if(f.singleOfftaker&&r()<.6)ev.push({id:"walk",title:"Your only buyer delays its offtake",text:"Your single buyer changes priorities and pushes the volume back by a year, much like BMW cancelling its €2B Northvolt order.",mit:false,months:8,src:"TNI p10; AFRY p22"});
  if(f.skippedDemo&&r()<.85||(!f.skippedDemo&&r()<p.tech))ev.push({id:"tech",title:"Integrated system underperforms",text:"Units that worked separately interact badly at scale. Output stalls at 55% of spec.",mit:f.tpi||(f.perfGuarantees&&!f.skippedDemo),mitText:f.tpi?"The performance insurance pays out while you fix it.":"Supplier performance guarantees fund the fixes.",months:9,delay:true,src:"BCG p9; AFRY p24"});
  if(f.interfaceRisk)ev.push({id:"iface",title:"Interface gaps between EPC packages",text:"Nobody owns the handover between the hydrogen, process and utilities packages. Rework follows.",mit:false,months:6,src:"OCED p20; AFRY p14"});
  if(r()<p.policy)ev.push({id:"policy",title:"Policy support is cut",text:"A new government freezes part of the support programme, echoing the US DOE terminating 223 projects worth over $7.5B in 2025. Green-premium buyers start renegotiating.",
    mit:R.policyHard?(f.offtakeBinding&&!f.grantDependent):(f.grantSigned||f.offtakeBinding||f.ccfd),mitText:R.policyHard?"Your binding offtake fixes the premium, and you never built the plan around a single subsidy.":f.grantSigned?"Your grant agreement was signed before FID, and your fixed-premium offtake holds.":"Your binding offtake fixes the premium regardless of policy.",months:4,src:"BCG p14, p16; Road p32"});
  if(r()<.55)ev.push(sectorEvent());
  if(R.event&&r()<.5)ev.push(regionEvent());
  if(ev.length<2&&!ev.find(e=>e.id==="sector"))ev.push(sectorEvent());
  S.events=ev.slice(0,6);S.evIdx=0;S.evResolved=false;S.evNote=null;
}

function responses(e){
  const f=S.flags,list=[];
  if(f.stratEquity||f.strategicPartner)list.push({id:"strat",label:"Ask your strategic partners to inject equity",note:"They have skin in the game. ≈8% dilution, +2 months.",v:"good",lesson:"Strategic investors with offtake and supply interests are the natural backstop: their stake depends on the plant working.",src:"TNI p7-10; OCED p32"});
  if(e.delay&&f.govLender)list.push({id:"gov",label:"Ask the public lender to reschedule repayments",note:"Flexible terms negotiated up front. +1 month, no dilution.",v:"good",lesson:"AFRY recommends negotiating adaptable debt repayment terms up front, because ramp-ups run long. Public lenders are more flexible than banks.",src:"AFRY p30, p32"});
  if((S.rescues||0)<2)list.push({id:"rescue",label:"Raise a rescue round from existing investors",note:`Down round. ≈${Math.round(DF().rescue*100)}% dilution, +4 months.`,v:"costly",lesson:"Overruns at FOAK usually end in new equity rounds or bridge loans. Pre-committed follow-on capital is cheaper than a rescue.",src:"AFRY p15, p32"});
  list.push({id:"absorb",label:"Push through without new money",note:"Costs 1 resilience point.",v:"bad",lesson:"Running on empty through a shock is how FOAKs stall before reaching full scale.",src:"TUM p21"});
  return list;
}

function buildScreen(){
  const e=S.events[S.evIdx];
  const intro=`<div class="story fade"><span class="eyebrow">Month ${Math.round(S.month)} · Construction & ramp-up</span><div class="lvl"><canvas data-sprite="${S.events[S.evIdx].mit?"heart":"cloud"}" data-scale="4" aria-hidden="true"></canvas><h2>Shock ${S.evIdx+1} of ${S.events.length}</h2></div>${S.evIdx===0?newsLine("build"):""}</div>`;
  let body=`<div class="feedback ${e.mit?"good":e.partial?"ok":"bad"}${!e.mit&&!S.evResolved?" alarm":""}"><span class="lesson"><b>${esc(e.title)}.</b></span><div class="convo">${bubble(P.cfo,e.text,false)}</div><span class="src">${esc(e.src)}</span></div>`;
  if(S.evNote)body+=S.evNote;
  if(e.mit){body+=`<div class="feedback good"><div class="convo">${bubble(S.flags.team?P.director:P.cfo,e.mitText+" We lose about "+Math.round(e.months/3)+" months, nothing more.",false)}</div><div class="why">${chip("good")}<span class="lesson"><b>Why:</b> you prepared for this earlier. Mitigation decided before FID is far cheaper than a rescue during construction.</span><span class="src">BCG p8; AFRY p30</span></div></div>`;}
  if((!e.mit)&&!S.evResolved){
    const rs=responses(e);
    body+=`<p>${e.partial?"Your contingency covers about half of it. ":""}${(S.rescues||0)>=2?"Your existing investors are tapped out after two rescue rounds. ":""}How do you respond?</p><div class="cards">${rs.map(r=>`<button class="card" data-resp="${r.id}"><span class="t">${esc(r.label)}</span><span class="meta">${esc(r.note)}</span></button>`).join("")}</div>`;
  }else{
    body+=`<div class="row"><button class="btn" id="evNext">${S.evIdx+1<S.events.length?"Next":"See outcome"}</button></div>`;
  }
  return intro+body;
}
function handleEventMit(){const e=S.events[S.evIdx];toast("RISK MITIGATED","good");sfx("up");S.month+=Math.round(e.months/3);record("Construction",e.title,"good",`Mitigated: ${e.mitText}`,e.src);S.evResolved=true;}
function respond(id){
  const e=S.events[S.evIdx];const r=responses(e).find(x=>x.id===id);
  const factor=e.partial?.5:1;
  if(id==="strat"){S.stake*=1-.08*factor;S.month+=2;}
  if(id==="gov"){S.month+=1;}
  if(id==="rescue"){S.stake*=1-DF().rescue*factor;S.month+=4;S.rescues=(S.rescues||0)+1;}
  if(id==="absorb"){S.res-=1;S.month+=e.months;toast("−1 ♥ RESILIENCE","bad");sfx("hurt");}
  S.month+=Math.round(e.months/2);
  record("Construction",`${e.title}: ${r.label.toLowerCase()}`,r.v,r.lesson,r.src);
  S.evResolved=true;
  const RT={strat:[P.strat,"We need this plant to work as much as you do. We'll put in more equity, but we want a seat on the project company's board."],
    gov:[P.publender,"We expected a long ramp-up. We'll reshape the repayment profile so amortisation starts a year later. No new money needed."],
    rescue:[P.vc,S.rescues>=2?"We'll do it, at a lower valuation. But understand this is the last time: our fund has no reserves left for you.":"We'll lead an insider round to get you through, but at a lower valuation. Next time, let's agree on follow-on capital before we need it."],
    absorb:[P.cfo,"We can stretch payables and freeze hiring for a quarter. But if anything else goes wrong, we have no buffer left."]};
  const [rp,rtext]=RT[id];
  S.evNote=`<div class="feedback ${r.v==="good"?"good":r.v==="costly"?"ok":"bad"} fade"><div class="convo">${bubble(P.you,r.label+".",true)}${bubble(rp,rtext,false)}</div><div class="why">${chip(r.v)}<span class="lesson"><b>Why:</b> ${esc(r.lesson)}</span><span class="src">${esc(r.src)}</span></div></div>`;
  if(S.res<=0){S.failed=true;}
  render();
}
function nextEvent(){
  if(S.failed){S.phase="end";render();window.scrollTo(0,0);celebrate("cloud","PROJECT STALLED","Too many unmitigated shocks. The debrief shows where it went wrong.",{sad:true,level:"GAME OVER"});return;}
  S.evIdx+=1;S.evResolved=false;S.evNote=null;
  if(S.events[S.evIdx]&&!S.events[S.evIdx].mit)sfx("alarm");
  if(S.evIdx>=S.events.length){S.month+=30;S.phase="end";render();window.scrollTo({top:0});celebrate("trophy","COMMERCIAL OPERATION!",`${S.name} runs the first plant of its kind, in month ${Math.round(S.month)}.`,{level:"YOU WIN"});return;}
  const e=S.events[S.evIdx]; if(e.mit)handleEventMit();
  render();
}

/* ---------------- End ---------------- */
function endScreen(){
  const judged=S.decisions.filter(d=>["good","ok","bad","trap"].includes(d.v)&&d.stage!=="Construction"&&d.stage!=="Quiz");
  const score=judged.length?judged.reduce((a,d)=>a+(d.v==="good"?1:d.v==="ok"?.5:0),0)/judged.length:0;
  const pct=Math.round(score*100);
  const years=(S.month/12).toFixed(1);
  let grade,head;
  if(S.failed){grade="—";head=`${S.name}\u2019s first plant stalls`;}
  else{grade=pct>=85&&S.stake>=20?"A":pct>=70?"B":pct>=55?"C":"D";head=`${S.name} brings its first-of-a-kind plant online`;}
  const verdictText=S.failed?`Too many unmitigated shocks drained the project. This is the most common FOAK failure pattern: escalating costs and failure to close the gap.`:
    `Your FOAK runs. ${S.foakStack&&S.foakStack.find(s=>s.id==="senior")?"With operating data and bank debt already in place, the next plant can be refinanced cheaply.":"With operating data, the next plant becomes bankable. This one was built on expensive capital."}`;
  const stack=S.foakStack?`<div class="need"><span class="eyebrow">Your FOAK capital stack</span>${(()=>{const save={stack:S.stack,cover:S.cover};S.stack=S.foakStack;S.cover=S.foakStack.reduce((a,s)=>a+s.cover,0);const h=stackBar();S.stack=save.stack;S.cover=save.cover;return h;})()}
    <div class="real"><div class="eyebrow">Compare · ${SEC().name}</div>${esc(SEC().real)} <span class="src">${SEC().realSrc}</span></div></div>`:"";
  const lines=S.decisions.map(d=>`<div class="dline"><div>${chip(d.v)}</div><div><div class="stage">${esc(d.stage)}</div><div class="lbl">${esc(d.label)}</div><p class="lesson">${esc(d.lesson)}</p><span class="src">${esc(d.src)}</span></div></div>`).join("");
  const used=[...new Set(S.decisions.flatMap(d=>Object.keys(SOURCES).filter(k=>d.src.includes(k))))];
  return `<div class="story fade" style="padding-top:12px"><span class="eyebrow">${SEC().name} · ${REGIONS[S.region].name} · ${DF().name}${S.failed?"":` · commercial operation in month ${Math.round(S.month)}`}</span><div class="lvl"><canvas data-sprite="${S.failed?"cloud":"trophy"}" data-scale="5" aria-hidden="true"></canvas><h1>${head}</h1></div><p>${verdictText}</p></div>
  <div class="grid2"><div class="stat"><span class="k">Instrument fit</span><span class="v">${pct}%</span></div>
  <div class="stat"><span class="k">Founder stake</span><span class="v">${S.stake.toFixed(1)}%</span></div>
  <div class="stat"><span class="k">Time</span><span class="v">${years} yrs</span></div>
  <div class="stat"><span class="k">Grade</span><span class="v">${grade}</span></div></div>
  ${endExtras(pct)}
  ${newCardsBlock()}
  ${stack}
  <div class="row"><button class="btn" id="again">Play again</button><button class="btn ghost" id="menu">Change sector or difficulty</button></div>
  <hr><div class="story"><span class="eyebrow">Debrief · every decision</span><h2>What you did, and what the research says</h2></div>
  <div class="debrief">${lines}</div>
  <div class="story"><span class="eyebrow">Sources</span><ul class="sources">${used.map(k=>`<li><b>${k}</b>: ${esc(SOURCES[k])}</li>`).join("")}</ul></div>
  ${aboutBlock(false)}`;
}

/* ---------------- Events ---------------- */
function bind(){
  const gd=app.querySelector(".guide");if(gd)gd.addEventListener("toggle",()=>{S.guideOpen=gd.open;});
  bindInter();
  app.querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>{pickRegion=b.dataset.region;render();});
  const nm=document.getElementById("coName");if(nm)nm.oninput=()=>{pickName=nm.value;};
  app.querySelectorAll("[data-sector]").forEach(b=>b.onclick=()=>{pickSector=b.dataset.sector;render();});
  app.querySelectorAll("[data-diff]").forEach(b=>b.onclick=()=>{pickDiff=b.dataset.diff;render();});
  const st=document.getElementById("start");if(st)st.onclick=()=>{fresh(pickSector,pickDiff,pickRegion,(pickName||"").trim());snap();render();window.scrollTo({top:0});};
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>chooseOption(b.dataset.opt));
  const sb=document.getElementById("sndBtn");if(sb)sb.onclick=toggleSound;
  app.querySelectorAll("[data-binder]").forEach(b=>b.onclick=()=>openBinder());
  app.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>openBinder(b.dataset.card));
  const rr=document.getElementById("resetRound");if(rr)rr.onclick=resetRound;
  const done=document.getElementById("done");if(done)done.onclick=stageDone;
  app.querySelectorAll("[data-dev]").forEach(b=>b.onclick=()=>{const id=b.dataset.dev,i=S.devSel.indexOf(id);if(i>=0)S.devSel.splice(i,1);else if(S.devSel.length<DF().devPicks)S.devSel.push(id);render();});
  const dg=document.getElementById("devGo");if(dg)dg.onclick=()=>{commitDev();window.scrollTo({top:0});};
  const dn=document.getElementById("devNext");if(dn)dn.onclick=()=>{startInterlude("dev");};
  app.querySelectorAll("[data-resp]").forEach(b=>b.onclick=()=>respond(b.dataset.resp));
  const en=document.getElementById("evNext");if(en)en.onclick=nextEvent;
  const ag=document.getElementById("again");if(ag)ag.onclick=()=>{fresh(S.sector,S.diff,S.region,S.name);snap();render();window.scrollTo({top:0});};
  const mn=document.getElementById("menu");if(mn)mn.onclick=()=>{pickSector=S.sector;pickDiff=S.diff;pickRegion=S.region;pickName=S.name;S=null;render();window.scrollTo({top:0});};
}

/* first build event auto-mitigation when entering build */
const _setup=setupEvents;
setupEvents=function(){_setup();const e=S.events[0];if(e&&e.mit)handleEventMit();else if(e)sfx("alarm");};

render();
</script>

</body>
